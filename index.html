  ctx.fillStyle='#fff'; ctx.font='bold 7px monospace'; ctx.textAlign='center';
  ctx.fillText('LIFEGUARD',x,y-23); ctx.textAlign='left';

function drawWaves(){
  const w=water;
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,SHORE-2); ctx.clip();   // wave faces stay in da water, never over da sand
  for(const wv of w.waves){
    const half=wv.len/2, x0=wv.x-half;
    // a rogue wave stands tall out back, then shrinks as it reaches da shallows and turns to whitewater
    const near=Math.max(0,Math.min(1,(SHORE-40-wv.y)/90));
    const riding=w.surfing&&w.cur===wv, k=wv.big ? 1+(wv.big-1)*near : 1;
    const breaking = wv.big && near<0.6;
    // sample a gentle arc so the crest curves instead of a flat bar
    for(let i=0;i<wv.len;i+=3){
      const t=i/wv.len;                    // 0..1 across the wave
      const arc=Math.sin(t*Math.PI)*3*k;   // peak in the middle
      const x=x0+i, yc=wv.y-arc;
      const faceCol = wv.messy ? '#6fa6b8' : (riding?'#6fd6e6':C.sea3);
      const lipCol  = wv.messy ? '#dfeef2' : C.foam;
      px(x, yc+2*k, 3, 5*k, shade(faceCol,-18));  // lower face (shadow)
      px(x, yc,     3, 3*k, faceCol);             // mid face
      if(k>1) px(x, yc+k, 3, k, shade(faceCol,14)); // a lit band across da big face
      px(x, yc-2*k, 3, 2*k, lipCol);              // breaking lip
      if(!wv.messy && (i%9===0)) px(x, yc-4*k, 2, 2, '#fff');  // foam flecks on the crest
      if(k>1 && (i+frame)%11===0) px(x+1, yc-4*k-2-((frame+i)%5), 2, 2, '#fff');  // spray blowing off da top
    }
    if(breaking){ // da big one breaking: a tumbling wall of whitewater rolling in
      for(let i=-half;i<half;i+=6){ const bob=Math.sin((i+frame)*0.25)*2;
        px(wv.x+i, wv.y-4*k+bob, 6, 3+k, '#ffffff'); px(wv.x+i+2, wv.y-6*k+bob, 3, 2, '#e8f6fa'); }
    }
    if(wv.messy){ // whitewater chop on a closeout
      for(let i=-half;i<half;i+=7) px(wv.x+i, wv.y-6+Math.sin((i+frame)*0.3)*2, 5, 3, '#fff');
    }
    if(riding){ // lit-up ridable face glowing under the board
      px(x0,wv.y+5,wv.len,2,'#aef'); px(x0,wv.y+7,wv.len,1,'#6cf');
    }
  }
  ctx.restore();
  // rogue-wave SURGE: a thin sheet of foam runs up da sand and slides back (harmless, see-through)
  for(const g of (w.surges||[])){
    const u=g.t/g.dur, reach=g.reach*Math.sin(Math.PI*Math.min(1,u*1.4));
    if(reach<=0.5) continue;
    ctx.save(); ctx.globalAlpha=0.55*(1-u*0.6);
    for(let i=-g.len/2;i<g.len/2;i+=4){ const r=reach*(0.75+0.25*Math.sin(i*0.21+g.t*0.05));
      px(g.x+i, SHORE-2, 4, r, '#eaf6f8'); px(g.x+i, SHORE-2+r-2, 4, 2, '#ffffff'); }
    ctx.restore();
  }
  // shorebreak CRASH foam — bursts along the sand where waves broke
  for(const c of w.crashes){
    const a=c.life/30, r=c.r|0;
    const col = c.messy ? '#dfeef2' : '#fff';
    px(c.x-r, c.y-2, r*2, 3, col);                 // spreading foam line
    px(c.x-(r>>1), c.y-4-(a*3|0), Math.max(2,r), 2, col); // upward splash puff
    if(c.life>18) px(c.x-1, c.y-6-(a*4|0), 2, 2, col);    // flung droplet
  }
}
const WADE_Y = SEABOT-34;   // below this line (closer to shore) you wade instead of swim
function drawLineup(){ if(IS_DOWN(beach.screen)) return; const LU=lineup();
  if(LU.shark) drawShark(LU.shark.x,LU.shark.y,LU.shark.dir||1);
  for(const h of LU.huis){ softShadow(h.x, h.y+9, 11); drawHui(h.x,h.y,h.surf); }
  if(LU.pro){ const L=LU.pro; softShadow(L.x, L.y+9, 12); drawBoard(L.x,L.y+4,C.sea1,-1); drawDude(L.x,L.surf?L.y-5:L.y+1,C.skin,'#111',-1,L.surf?'surf':'paddle',frame);
    if(L.female){ // swim top for the women surfers (original, generic)
      if(L.surf){ const ty=L.y-10; px(L.x-5,ty,10,3,'#ff5aa0'); px(L.x-5,ty,10,1,'#ff8cc0'); px(L.x-1,ty,2,1,'#c03a78'); }  // top across da chest (surf torso is y-11..y-3)
      else { px(L.x-8,L.y+1,7,2,'#ff5aa0'); px(L.x-8,L.y+1,7,1,'#ff8cc0'); } }                                 // lying flat paddling: band on da chest


    nameTag(L.name.toUpperCase(),L.x,L.y-23,C.gold); }
}
function drawWater(){
  const w=water;
  // the beach strip stays alive while you surf: Chandler + props + photographer + buggy
  // are the SAME persistent beach, drawn on the shore at the bottom of the water view.
  // waves first (they stay in da water), then da beach strip on top
  drawWaves();
  drawBeachProps();
  for(const [x,by] of BEACH_PALMS[beach.screen]||[]) drawPalm(x,by);
  drawLineup();
  // spray particles (behind the surfer)
  for(const s of w.spray){ const c = s.kind==='barrel'?C.purp : s.life>12?'#fff':C.foam; px(s.x,s.y,2,2,c); }
  // player
  if(player.downT>0){ drawDude(player.x,player.y,C.skin,player.shorts,player.facing,'down',frame,null,PLAYER_HAIR); }
  else {
    if(!w.surfing && player.y>WADE_Y){   // wading in da shallows: walk wit' da board under your arm, water round your knees
      const moving=keys.left||keys.right||keys.up||keys.down, wy=player.y;   // drawn where you stand, so beach <-> water lines up
      drawBeachBoard(player.x,wy,player.facing,true);
      drawDude(player.x,wy,C.skin,player.shorts,player.facing,moving?'walk':'stand',frame,player.shirt,PLAYER_HAIR);
      ctx.save(); ctx.globalAlpha=.55; px(player.x-9,wy+9,18,8,C.sea3); ctx.restore();          // water over da legs
      const r=(frame>>3)%2; px(player.x-10-r,wy+9,20+2*r,1,C.foam); px(player.x-6,wy+11,3,1,'#fff'); // ripple ring
      if(player.injured) px(player.x-3,wy-20,6,3,C.bad);
      return;
    }
    softShadow(player.x, player.y+9, 13);
    drawBoard(player.x,player.y+4,player.board,player.facing);
    const TK = player.trickT>0 ? TRICKS.find(t=>t.id===player.trickKind) : null;
    const pose = !w.surfing ? 'paddle' : TK ? TK.pose : 'surf';
    // airs leave da wave, floaters ride up on da lip, roundhouses flip direction mid-turn
    const lift = !TK ? 0 : TK.id==='air' ? -Math.round(12*Math.sin(Math.PI*(1-player.trickT/32))) : TK.id==='float' ? -5 : 0;
    const face = TK && TK.id==='round' && player.trickT<11 ? -player.facing : player.facing;
    // board carve tilt during a cutback reads as a little spray arc under the tail
    if(w.surfing&&player.trickT>0){ for(let i=0;i<4;i++) px(player.x-14+i*8, player.y+9+Math.sin(frame*0.4+i)*2, 3,2, C.foam); }
    // prone paddler lies right on the deck; standing poses keep their offset
    if(lift<0) drawBoard(player.x,player.y+4+lift,player.board,face);   // board comes wit' you on an air / floater
    drawDude(player.x, pose==='paddle' ? player.y+1 : player.y-5+lift, C.skin,player.shorts,face,pose,frame,player.shirt,PLAYER_HAIR);
    if(w.surfing){
      const label = TK ? TK.name.replace(/!/g,'').toUpperCase() : 'SHREDDIN';
      const col = TK ? (TK.id==='barrel'?C.purp:TK.id==='air'?C.bad:C.gold) : C.good;
      px(player.x-20,player.y-32,40,4,'#002'); ctx.fillStyle=col; ctx.font='8px monospace'; ctx.textAlign='center';
      ctx.fillText(label,player.x,player.y-33); ctx.textAlign='left';
    }
  }
  if(player.injured) px(player.x-3,player.y-28,6,3,C.bad);
}
function drawShark(x,y,dir){
  // Drawn facing right; mirror each block around x when swimming left.
  const p=(bx,w,by,h,c)=>{ px(dir<0 ? 2*x-bx-w : bx, by, w, h, c); };
  p(x-14,26,y-3,7,C.shark); p(x-17,4,y-1,4,C.shark); p(x-14,22,y+2,3,C.sharkBelly);
  p(x-2,5,y-10,7,C.shark); p(x+10,4,y-2,2,'#222'); }
function drawHui(x,y,surfing){ drawBoard(x,y+4,'#222',-1); drawDude(x,surfing?y-5:y+1,C.huiSkin,C.hui,-1,surfing?'surf':'paddle',frame);
  nameTag('HUI',x,surfing?y-24:y-12,C.bad); }

function drawShop(){
  // dim the beach behind the menu
  ctx.save(); ctx.globalAlpha=0.72; px(0,0,W,H,'#0a0618'); ctx.restore();
  const bw=320, bh=236, bx=(W-bw)/2, by=(H-bh)/2;
  px(bx,by,bw,bh,'#14233a'); ctx.strokeStyle=C.good; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
  // striped header like the awning
  for(let i=0;i<bw/10;i++) px(bx+i*10,by,10,10,i%2?'#ff5a7a':'#fff');
  ctx.textAlign='center'; ctx.fillStyle='#14233a'; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText('SHAVE ICE & SURF SHOP',W/2,by+8);
  ctx.fillStyle=C.gold; ctx.font='bold 11px "Courier New",monospace';
  ctx.fillText('🪙 '+coins+' coins',W/2,by+24);
  ctx.font='9px "Courier New",monospace'; ctx.textAlign='left';
  let yy=by+38;
  const SL=shopList();
  for(let i=0;i<SL.length;i++){
    const it=SL[i], isSel=i===shop.sel;
    const ownedIt = it.kind==='treat' ? false : owned.includes(it.id);
    const equipped = it.kind!=='treat' && equip[it.kind]===it.id;
    if(isSel){ px(bx+6,yy-8,bw-12,13,'#24456a'); }
    if(it.color && it.color!=='none') px(bx+12,yy-6,9,9,it.color); else px(bx+12,yy-6,9,9,'#334');
    ctx.fillStyle = isSel?C.gold:C.txt;
    let label=it.name;
    if(it.perk==='longboard') label+=' ·catches easier';
    if(it.perk==='tough') label+=' ·+1 hit';
    ctx.fillText(label, bx+26, yy+1);
    ctx.textAlign='right';
    const right = equipped ? 'EQUIPPED' : ownedIt ? 'owned·ENTER' : (it.price===0?'free':('🪙'+it.price));
    ctx.fillStyle = equipped?C.good : ownedIt?'#8fb' : (coins>=it.price?C.gold:C.bad);
    ctx.fillText(right, bx+bw-12, yy+1);
    ctx.textAlign='left';
    yy+=15;
  }
  ctx.textAlign='center'; ctx.fillStyle='#8fb'; ctx.font='8px "Courier New",monospace';
  ctx.fillText('up/down choose · ENTER buy/equip · B close',W/2,by+bh-8);
  ctx.textAlign='left';
}

function drawHUD(){
  px(0,0,W,16,'#00000059');
  ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='left';

  ctx.textAlign='center'; ctx.fillStyle=C.txt; ctx.fillText(state==='beach'?(BREAK[beach.screen]?'🏝 '+BREAK[beach.screen].name:IS_DOWN(beach.screen)?'🌿 NORTH SHORE':'🏖 BEACH'):state==='shop'?'🍧 SHOP':state==='cabin'?ROOMS[room].label:'🌊 LINEUP',W/2,12);
  ctx.textAlign='left'; ctx.fillStyle=C.gold; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText('🪙 '+coins, 6, 12);
  if(heat.on){ const b2=bestTwo(heat.scores), lead=heat.opp.reduce((m,o)=>o.s>m.s?o:m,heat.opp[0]);
    px(W/2-150,18,300,14,'#000000aa'); ctx.textAlign='center'; ctx.fillStyle=heat.t<600?C.bad:C.gold; ctx.font='bold 9px "Courier New",monospace';
    ctx.fillText('PIPE MASTERS  '+Math.floor(heat.t/3600)+':'+String(Math.ceil(heat.t/60)%60).padStart(2,'0')+'   YOU '+b2.toFixed(1)+'   LEADER '+lead.n+' '+lead.s.toFixed(1),W/2,28);
    ctx.textAlign='left'; ctx.font='bold 10px "Courier New",monospace'; }
  ctx.fillStyle=C.good; ctx.font='bold 9px "Courier New",monospace'; ctx.fillText(RANKS[rankIdx()].n+' '+xp+'xp', 56, 12); ctx.font='bold 10px "Courier New",monospace';
  ctx.font='bold 11px "Courier New",monospace';
  if(state==='water'&&water.surfing){ ctx.fillStyle=C.purp; ctx.fillText('RIDE '+(water.ride/60).toFixed(1)+'s'+(water.combo>1?('  x'+water.combo):''),W/2,28); }
  if(player.injured){ ctx.fillStyle=C.bad; ctx.textAlign='center'; ctx.fillText('🩹 HURT — heal at Chandler on da beach',W/2, state==='water'?44:28); }
  if(flashT>0&&flash){ ctx.fillStyle=flash.col; ctx.font='bold 11px monospace'; ctx.textAlign='center'; ctx.fillText(flash.txt,flash.x,flash.y); }
  ctx.textAlign='left';
}
let bannerH=0;   // height of da message bar this frame (key legend sits above it)
function drawBanner(){
  bannerH=0; if(msgT<=0||!msg) return;
  ctx.font='10px "Courier New",monospace'; ctx.textAlign='center';
  const maxW=W-28, words=msg.split(' '), lines=[]; let cur='';
  for(const wd of words){ const t=cur?cur+' '+wd:wd; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=wd; } else cur=t; }
  if(cur) lines.push(cur);
  const lh=12, h=lines.length*lh+5, w=Math.min(W-12, Math.max(...lines.map(l=>ctx.measureText(l).width))+16), a=Math.min(1,msgT/20);
  const top=H-7-h; bannerH=h+7;
  ctx.globalAlpha=.86*a; px(W/2-w/2,top,w,h,'#0a0618');
  ctx.globalAlpha=a; ctx.fillStyle=C.good; lines.forEach((l,k)=>ctx.fillText(l,W/2,top+11+k*lh));
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ---- loop ---- */
function loop(){ update(); for(const k in pressed) pressed[k]=false;   // drop stale taps so B only counts when pressed right there
  ctx.clearRect(0,0,W,H); render(); requestAnimationFrame(loop); }
loop();

/* register the service worker so the game installs + plays offline (http/https only) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
