<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>North Shore — Soul Surf</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; width:100%; background:#140a20; color:#ffe9c7;
    font-family:"Courier New",monospace; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap { position:relative; width:100%; height:100%;
          display:flex; align-items:center; justify-content:center; }
  canvas { display:block; image-rendering:pixelated;
           box-shadow:0 0 0 3px #5de0c4, 0 6px 44px rgba(0,0,0,.65); border-radius:4px; }
  #hint { position:absolute; left:0; right:0; bottom:6px; text-align:center;
          font-size:11px; letter-spacing:1px; color:#8fb; opacity:.6;
          text-shadow:0 1px 2px #000; pointer-events:none; }
  @media (max-width:640px){ #hint{ display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="320"></canvas>
  <div id="hint">← → steer · ↑ paddle out · SPACE drop-in / kick out · Z cutback · X off-the-lip · Z+X barrel · ↓ go to beach · ENTER start · M mute</div>
</div>
<script>
"use strict";
/* ============================================================
   NORTH SHORE — SOUL SURF  (v2)
   One-file 16-bit surf game. Canvas + vanilla JS, art in code.
   No winners/losers. localStorage high score. 100% offline.
   Homage to NORTH SHORE (1987). Likeness: full copy, Matt's call.
   ============================================================ */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
ctx.imageSmoothingEnabled = false;

/* ---- responsive scaling: fill the window, minimal wasted space ---- */
function fit(){
  const mw = innerWidth, mh = innerHeight;
  // largest scale that fits either dimension (fractional) — fills the window
  const s = Math.min(mw/W, mh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize', fit);
addEventListener('load', fit);
fit();

/* ---- palette ---- */
const C = {
  skyTop:'#2b1a4a', s1:'#5a2a6b', s2:'#b34a7a', s3:'#e8683f', s4:'#f59a3c', s5:'#ffc94d',
  sun:'#ffe08a', sunCore:'#fff3c4',
  seaDeep:'#10395a', sea1:'#1c6a8c', sea2:'#2f93aa', sea3:'#4fb4c4', foam:'#eafcff',
  sand:'#e9cf8f', sandDot:'#d8b66f', sandWet:'#c9a85f',
  mtnA:'#2d5a3f', mtnB:'#3f2a56',
  skin:'#c88a4e', hair:'#2a1a12',
  huiSkin:'#9a5a2e', hui:'#3a2a44',
  shark:'#5a6b78', sharkBelly:'#cdd8de',
  txt:'#ffe9c7', good:'#5de0c4', bad:'#ff6b6b', gold:'#ffd27f', purp:'#c9a0ff'
};

/* ---- input ---- */
const keys={}, pressed={};
addEventListener('keydown',e=>{ const k=norm(e); if(k){ if(!keys[k])pressed[k]=true; keys[k]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault(); if(!actx)initAudio(); }});
addEventListener('keyup',e=>{ const k=norm(e); if(k)keys[k]=false; });
function norm(e){ switch(e.key){
  case 'ArrowLeft':case 'a':case 'A':return 'left';
  case 'ArrowRight':case 'd':case 'D':return 'right';
  case 'ArrowUp':case 'w':case 'W':return 'up';
  case 'ArrowDown':case 's':case 'S':return 'down';
  case ' ':return 'space'; case 'Enter':return 'enter';
  case 'z':case 'Z':return 'z'; case 'x':case 'X':return 'x';
  case 'b':case 'B':return 'b';
  case 'm':case 'M':return 'mute'; default:return null; } }
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }

/* ---- touch ---- */
cv.addEventListener('touchstart',t=>{ onTouch(t); if(!actx)initAudio(); },{passive:false});
cv.addEventListener('touchmove',onTouch,{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); keys.left=keys.right=keys.up=false;
  pressed.space=true; if(state==='splash'||state==='help')pressed.enter=true; },{passive:false});
function onTouch(e){ e.preventDefault(); const r=cv.getBoundingClientRect(), t=e.touches[0]; if(!t)return;
  const x=(t.clientX-r.left)/r.width, y=(t.clientY-r.top)/r.height;
  keys.left=x<.34; keys.right=x>.66; keys.up=y<.4; keys.down=y>.82; }

/* ---- audio ---- */
let muted=false, actx=null, musicGain=null;
function initAudio(){ try{ actx=new (AudioContext||webkitAudioContext)();
  musicGain=actx.createGain(); musicGain.gain.value=0.0; musicGain.connect(actx.destination); startMusic(); }catch(e){} }
function beep(f=440,d=.08,type='square',v=.05){ if(muted||!actx)return;
  try{ const o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f;
    o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
/* mellow surf-rock-ish arpeggio loop */
let musicStep=0, musicT=0;
const scale=[0,3,5,7,10,12];
function startMusic(){ if(musicGain) musicGain.gain.value = muted?0:0.0; }
function music(){ if(!actx||muted){ if(musicGain)musicGain.gain.value=0; return; }
  musicGain.gain.value=0.02; musicT++;
  if(musicT%26===0){ const root=48+(Math.floor(musicStep/6)%2?5:0);
    const n=root+scale[musicStep%scale.length];
    const f=440*Math.pow(2,(n-69)/12);
    const o=actx.createOscillator(),g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
    o.connect(g); g.connect(musicGain); g.gain.setValueAtTime(.5,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4); o.start(); o.stop(actx.currentTime+.42);
    musicStep++; } }

/* ---- high score ---- */
const HS='nsss_hi';
const getHS=()=>parseInt(localStorage.getItem(HS)||'0',10)||0;
const setHS=v=>{ try{localStorage.setItem(HS,String(v));}catch(e){} };

/* ---- wallet + owned/equipped gear (persisted) ---- */
const WALLET='nsss_coins', OWNED='nsss_owned', EQUIP='nsss_equip';
const getCoins=()=>parseInt(localStorage.getItem(WALLET)||'0',10)||0;
const setCoins=v=>{ try{localStorage.setItem(WALLET,String(v));}catch(e){} };
function loadOwned(){ try{ return JSON.parse(localStorage.getItem(OWNED)||'["board_teal","shorts_blue"]'); }catch(e){ return ['board_teal','shorts_blue']; } }
function saveOwned(a){ try{ localStorage.setItem(OWNED,JSON.stringify(a)); }catch(e){} }
function loadEquip(){ try{ return JSON.parse(localStorage.getItem(EQUIP)||'{"board":"board_teal","shorts":"shorts_blue","shirt":"none"}'); }catch(e){ return {board:'board_teal',shorts:'shorts_blue',shirt:'none'}; } }
function saveEquip(o){ try{ localStorage.setItem(EQUIP,JSON.stringify(o)); }catch(e){} }

/* ---- utils ---- */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const near=(ax,ay,bx,by,r)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<r*r;};
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

/* ============================================================
   SPRITES
   ============================================================ */
function drawDude(x,y,skin,trunks,facing,pose,t){
  const fx=facing<0?-1:1;
  const skinD = shade(skin,-28);            // shadow tone
  ctx.save(); ctx.translate(x|0,y|0); ctx.scale(fx,1);
  if(pose==='down'){ px(-8,2,16,5,skin); px(-8,5,16,2,skinD); px(-6,-1,5,5,C.hair);
    const b=(t>>2)%2; px(-11,-6,3,3,b?C.gold:C.foam); px(9,-7,3,3,b?C.foam:C.gold); ctx.restore(); return; }
  const stride=pose==='walk'?Math.sin(t*0.35)*2:0;

  if(pose==='surf'||pose==='cut'||pose==='lip'||pose==='barrel'){
    const skinH=shade(skin,22), rim='#ffcf8a';   // highlight tone + sunset rim-light
    // crouch amount + lean per trick
    let crouch=2, leanArmUp=false, tuck=false, lean=0;
    if(pose==='cut'){ crouch=4; lean=-3; }          // low carve, leaning back
    else if(pose==='lip'){ crouch=0; leanArmUp=true; } // standing tall, arm to the sky
    else if(pose==='barrel'){ crouch=6; tuck=true; }   // deep tuck
    // legs (bent, wide stance) — 3-tone
    px(-6,6,4,6,skin); px(-6,6,2,6,skinH); px(-6,9,4,3,skinD);
    px(2,6,4,6,skin);  px(2,6,2,6,skinH);  px(2,9,4,3,skinD);
    px(-8,11,7,3,'#1b2a33'); px(2,11,7,3,'#1b2a33');   // feet planted
    // trunks w/ waistband highlight + shadow stripe
    px(-4+lean,3-crouch,9,4,trunks); px(-4+lean,3-crouch,9,1,shade(trunks,36)); px(3+lean,3-crouch,1,4,shade(trunks,-34));
    // torso: shadow core, lit left, sunset rim on the sun side (right in local space)
    px(-4+lean,-4-crouch,9,8,skin); px(-4+lean,-4-crouch,3,8,skinH); px(1+lean,-4-crouch,4,8,skinD);
    px(5+lean,-4-crouch,1,8,rim);
    // arms per pose (3-tone)
    if(tuck){ px(-9+lean,-1-crouch,5,3,skin); px(5+lean,-1-crouch,5,3,skin); px(5+lean,-1-crouch,5,1,rim); }
    else if(leanArmUp){ px(-10+lean,-10-crouch,4,8,skin); px(-10+lean,-10-crouch,2,8,skinH); px(5+lean,-3-crouch,5,3,skin); }
    else { px(-11+lean,-3-crouch,6,3,skin); px(-11+lean,-3-crouch,6,1,skinH); px(5+lean,-6-crouch,6,3,skin); px(5+lean,-6-crouch,6,1,rim); }
    // head: lit crown, shadow jaw, rim on the sun side
    px(-3+lean,-11-crouch,7,7,skin); px(-3+lean,-11-crouch,3,7,skinH); px(1+lean,-11-crouch,3,7,skinD);
    px(4+lean,-11-crouch,1,7,rim);
    px(-3+lean,-12-crouch,7,3,C.hair); px(-3+lean,-12-crouch,2,4,C.hair);
    ctx.restore(); return;
  }
  if(pose==='paddle'){
    // prone, side-on: lying flat on the board, chest lifted, arms stroking forward
    const strokeF=Math.sin(t*0.35), strokeB=Math.sin(t*0.35+Math.PI);
    // legs/feet trailing back along the board
    px(-12,2,8,3,skin); px(-12,3,8,1,skinD);
    // hips + trunks
    px(-6,0,7,4,trunks); px(-6,0,7,1,shade(trunks,30));
    // torso lying flat, chest end lifted a touch
    px(0,-1,8,4,skin); px(0,2,8,1,skinD);
    // head up, looking forward over the nose of the board
    px(7,-3,5,5,skin); px(10,-3,2,5,skinD); px(7,-4,5,2,C.hair);
    // arms reaching ahead and down into the water, alternating stroke
    px(9,-1+strokeF*2,5,2,skin);   // forward (reaching) arm
    px(2,3+strokeB*2,5,2,skin);    // trailing (pulling) arm
    // little hand-splash at the stroking hand
    if(strokeF>0.6) px(13,2,3,2,C.foam);
    ctx.restore(); return;
  }
  // stand / walk — 3-tone with sunset rim
  const skinH2=shade(skin,22), rim2='#ffcf8a';
  px(-3,6,3,7+stride,skin); px(1,6,3,7-stride,skin);
  px(-3,13,4,2,'#1b2a33'); px(1,13,4,2,'#1b2a33');
  px(-4,3,9,4,trunks); px(-4,3,9,1,shade(trunks,36));
  px(-4,-4,9,8,skin); px(-4,-4,3,8,skinH2); px(1,-4,4,8,skinD); px(5,-4,1,8,rim2);
  px(-6,-3,3,6,skin); px(4,-3,3,6,skin); px(5,-3,2,6,rim2);
  px(-3,-11,7,7,skin); px(-3,-11,3,7,skinH2); px(1,-11,3,7,skinD); px(4,-11,1,7,rim2); px(-3,-12,7,3,C.hair);
  ctx.restore();
}
function shade(hex,amt){ // lighten(+)/darken(-) a #rrggbb
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function drawBoard(x,y,col,facing){
  const fx=facing<0?-1:1; ctx.save(); ctx.translate(x|0,y|0); ctx.scale(fx,1);
  px(-12,0,26,4,col); px(-12,0,26,1,shade(col,34)); px(-12,3,26,1,shade(col,-34)); // deck hi + rail shadow
  px(-12,1,26,1,'#fff'); px(11,1,5,3,col); px(13,1,2,2,shade(col,34)); ctx.restore();
}

/* ============================================================
   32-BIT RENDER HELPERS — gradient ramps, ordered dithering, soft shadow
   ============================================================ */
// 4x4 Bayer ordered-dither threshold matrix (0..15)
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dither(x,y,t){ return BAYER[(y&3)*4+(x&3)] < t*16; }
function lerpCol(a,b,t){ // blend two #rrggbb
  const na=parseInt(a.slice(1),16), nb=parseInt(b.slice(1),16);
  const r=Math.round(((na>>16)&255)*(1-t)+((nb>>16)&255)*t);
  const g=Math.round(((na>>8)&255)*(1-t)+((nb>>8)&255)*t);
  const bl=Math.round((na&255)*(1-t)+(nb&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
// vertical gradient band from colA(top) to colB(bottom), dithered at the seams
function gradBand(x,y,w,h,colA,colB,steps){
  steps=steps||h; const sh=Math.max(1,h/steps);
  for(let i=0;i<steps;i++){
    const t=i/(steps-1||1);
    px(x, y+i*sh, w, Math.ceil(sh)+1, lerpCol(colA,colB,t));
    // dither a 2px seam into the next tone for a smooth 32-bit blend
    if(i<steps-1){ const nc=lerpCol(colA,colB,(i+1)/(steps-1||1)); const yy=(y+i*sh+sh)|0;
      for(let xx=x;xx<x+w;xx+=2) if(dither(xx,yy,0.5)) px(xx,yy,1,1,nc); }
  }
}
function softShadow(x,y,w){ // elliptical drop shadow on the sand/water
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x,y,w,w*0.35,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}

/* ============================================================
   BACKGROUND
   ============================================================ */
let seaPhase=0;
function drawSky(){
  // smaller sky now (horizon at 96): compress the dithered sunset gradient
  gradBand(0,0,W,30, C.skyTop, C.s2, 9);
  gradBand(0,30,W,30, C.s2, C.s3, 9);
  gradBand(0,60,W,36, C.s3, C.s5, 10);
  // sun — glowing disc with soft haze rings (sits lower on the new horizon)
  const sx=W*0.62, sy=80;
  ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle=C.sun;
  ctx.beginPath(); ctx.arc(sx,sy,40,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=0.12; ctx.beginPath(); ctx.arc(sx,sy,54,0,Math.PI*2); ctx.fill(); ctx.restore();
  for(let r=26;r>=0;r-=2){
    const t=r/26, col = lerpCol(C.sunCore, '#f7a24a', t);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
  }
  // soft stacked clouds (no hard edges)
  cloud(392,34); cloud(60,24); cloud(300,30);
  // birds, slow drift
  const bw=(frame*0.12)%40;
  px(150-bw,54,4,2,'#2a1a2a'); px(154-bw,53,3,2,'#2a1a2a');
  px(300-bw*0.6,46,4,2,'#2a1a2a'); px(304-bw*0.6,47,3,2,'#2a1a2a');
}
function cloud(x,y){
  // soft cloud with a lit top edge and dithered underside
  px(x,y+4,46,5,'#f3a6c0'); px(x+6,y,34,5,'#f6b8cd'); px(x+2,y+8,42,3,'#e894b4');
  px(x+6,y,34,2,'#ffc9dd');  // lit top
  for(let xx=x+2;xx<x+44;xx+=2) if(dither(xx,y+11,0.5)) px(xx,y+11,1,1,'#d87ca0'); // dithered base
}
function ridge(pts,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],118);
  for(const p of pts) ctx.lineTo(p[0],p[1]); ctx.lineTo(pts[pts.length-1][0],96); ctx.closePath(); ctx.fill(); }
function ridgeBase(){ return 96; }
function drawMountains(){
  // smaller ridges, base pinned to the new horizon (96)
  ridge([[0,78],[30,64],[55,72],[90,50],[130,66],[175,56],[220,74],[260,62],[300,78],[330,72]], C.mtnB);
  ridge([[0,92],[26,72],[48,80],[78,52],[96,62],[120,46],[150,70],[200,86]], C.mtnA);
  ridge([[0,92],[26,72],[48,80],[78,52],[96,62],[120,46],[120,92]], shade(C.mtnA,-22)); // shadow side
  ctx.fillStyle=shade(C.mtnA,24);  // sunlit facet
  ctx.beginPath(); ctx.moveTo(120,46); ctx.lineTo(146,70); ctx.lineTo(130,70); ctx.closePath(); ctx.fill();
  // dithered ridge haze at the base where it meets the sea
  for(let x=0;x<W;x+=2) if(dither(x,94,0.4)) px(x,94,1,2,shade(C.mtnB,20));
}
const SEATOP=96, SEABOT=252, SHORE=252;
function drawSeaBands(){
  // 32-bit translucent depth gradient: deep at the horizon → bright toward shore, dithered
  gradBand(0,SEATOP,W,(SEABOT-SEATOP)*0.5, C.seaDeep, C.sea1, 10);
  gradBand(0,SEATOP+(SEABOT-SEATOP)*0.5,W,(SEABOT-SEATOP)*0.5, C.sea1, C.sea3, 10);
  // subtle shimmer: translucent light streaks that bob in place
  ctx.save(); ctx.globalAlpha=0.5;
  for(let i=0;i<12;i++){
    const yy=SEATOP+8+i*11, bob=Math.sin(frame*0.03+i)*1;
    for(let x=(i*47)%90; x<W; x+=90){ px(x, yy+bob, 16, 1, lerpCol(C.sea3,C.foam,0.6)); }
  }
  ctx.restore();
  // sun glitter path — scattered sparkles that fan WIDER toward shore (no solid tube)
  const sx=W*0.62;
  for(let yy=SEATOP+2; yy<SEABOT; yy+=4){
    const depth=(yy-SEATOP)/(SEABOT-SEATOP);     // 0 at horizon, 1 at shore
    const spread=3 + depth*22;                   // fan out as it nears the beach
    const n=1+Math.round(depth*3);
    for(let k=0;k<n;k++){
      const jx = (Math.sin(yy*0.7 + k*2.3 + frame*0.03)* spread);
      const bright = (Math.sin(yy*1.3 + k + frame*0.08) > 0.1);
      if(bright) px(sx + jx - 2, yy, 4, 2, k%2? C.sunCore : '#ffd98a');
    }
  }
}
function drawSand(){
  // 32-bit sand: dithered wet-to-dry gradient down the beach
  gradBand(0,SHORE,W,H-SHORE, C.sandWet, C.sand, 8);
  // beveled shoreline: bright foam lip, then a wet-sand band, then dry sand
  px(0,SHORE-3,W,3,C.foam);
  px(0,SHORE,W,2,'#fff');
  px(0,SHORE+2,W,4,C.sandWet);
  // wet-sheen reflection just below the waterline (translucent)
  ctx.save(); ctx.globalAlpha=0.3; for(let x=0;x<W;x+=3) if(dither(x,SHORE+7,0.5)) px(x,SHORE+6,2,3,'#fff'); ctx.restore();
  // scalloped foam edge
  for(let x=0;x<W;x+=14) px(x+3,SHORE-4,8,2,C.foam);
  ctx.fillStyle=C.sandDot;
  for(let i=0;i<150;i++){ const x=(i*53)%W, y=SHORE+10+((i*31)%(H-SHORE-12)); ctx.fillRect(x,y,2,2); }
}
function drawPalm(x,by){
  // curved trunk
  for(let i=0;i<46;i+=4){ const sway=Math.sin(i*0.12)*3; px(x+sway,by-46+i,6,4,'#7a4a22'); px(x+sway,by-46+i,2,4,'#8a5a2a'); }
  const tx=x+Math.sin(0)*3; // top
  const g='#2f9e52',g2='#277f43',g3='#39b863';
  // drooping fronds
  px(tx-22,by-50,24,5,g2); px(tx-20,by-46,18,4,g);
  px(tx+4,by-50,24,5,g2);  px(tx+8,by-46,18,4,g);
  px(tx-14,by-57,32,5,g3); px(tx-11,by-62,26,5,g);
  px(tx-4,by-66,12,5,g3);
  px(tx-2,by-50,8,6,'#6a4a2a'); // coconuts
}

/* ============================================================
   STATE
   ============================================================ */
let state='splash';  // splash | help | beach | water | gameover
let score=0, high=getHS(), frame=0;
let msg='', msgT=0, flash=null, flashT=0;
function setMsg(m,d=140){ msg=m; msgT=d; }
function floatScore(txt,x,y,col){ flash={txt,x,y,col:col||C.gold}; flashT=70; }

const player={ x:W/2, y:0, facing:1, board:C.good, shorts:'#2a3a6a', shirt:'none',
  injured:0, recover:0, downT:0, invuln:0, trickT:0, trickKind:'', knockT:0, hitCool:0 };

// apply saved equip to the player's look
function applyEquip(){
  const b=SHOP.find(s=>s.id===equip.board); if(b) player.board=b.color;
  const sh=SHOP.find(s=>s.id===equip.shorts); if(sh) player.shorts=sh.color;

  player.longboard = !!(bb && bb.perk==='longboard');
  player.tough = (equip.shirt==='shirt_rash');
}

let beach={}, water={ waves:[], huis:[], pro:null, shark:null, surfing:false, cur:null, spray:[], crashes:[],
  ride:0, combo:0, waveT:30, sharkT:9999, huiT:9999, proT:9999, style:0 };
let beachBuilt=false;

function buildBeach(){
  beach={ photographer:null, buggy:null, chandler:{x:58,y:H-54}, local:null, tourist:null,
    props:[], photoT:ri(160,340), buggyT:ri(260,560), chatCool:60, localT:ri(2400,3600), touristT:ri(400,900),
    // fixed Hawaiian-flair buildings
    iceShop:{x:W-70, y:SHORE+22},     // shave-ice stand = the SHOP (town screen)
    shack:{x:118, y:SHORE+20},        // surf shack / home (town screen)
    folks:[ {x:W*0.42, y:H-30, cool:0}, {x:W*0.72, y:H-22, cool:0} ],  // locals (town)
    house:{x:W/2, y:SHORE+40},        // RCVA surf house (house screen, below surf)
    cars:[], road:[], scrLock:0,      // road traffic behind the house
    screen:1 };                       // 0=TOWN  1=SURF  2=COVE  3=RCVA HOUSE  (start on surf)
  const kinds=['slipper','honu','cooler'];
  for(let i=0;i<3;i++) beach.props.push({k:kinds[i],x:rnd(90,W-90),y:rnd(H-70,H-24)});
  beachBuilt=true;
}
// which screen owns which flair
const SCR={ TOWN:0, SURF:1, COVE:2, HOUSE:3 };
function announceScreen(){
  const b=beach;
  if(b.screen===SCR.TOWN) setMsg("◀ TOWN — shave-ice shop, surf shack, locals",120);
  else if(b.screen===SCR.SURF) setMsg("SURF SPOT — ↑ paddle out · ↓ to da RCVA house",120);
  else if(b.screen===SCR.COVE) setMsg("COVE ▶ — quiet beach, photographer hangs here",120);
  beep(560,.07,'triangle');
}

function enterBeach(reason){
  if(!beachBuilt) buildBeach();          // beach persists; built once, never wiped
  // come ashore where you left the water: keep your x, land at the shoreline
  const comingFromWater = (state==='water');
  state='beach';
  if(comingFromWater){ player.x=clamp(player.x,16,W-16); player.y=SHORE+10; }
  else { player.x=W/2; player.y=H-40; }
  player.facing=1; player.downT=0;
  setMsg(reason||"PAU HANA — walk da beach. STOP walking to plant your board. ↑ at da shoreline fo' paddle out",180);
}
function enterWater(){
  if(player.injured){ setMsg("You stay hurt, cuz — go find Chandler fo' heal!",150); return; }
  state='water'; player.x=clamp(player.x,14,W-14); player.y=SEABOT-14; player.facing=1; player.downT=0;
  player.shieldUsed=false;   // rashguard perk recharges each paddle-out
  water.surfing=false; water.cur=null; water.ride=0; water.combo=0; water.style=0; water.spray=[];
  water.huis=[]; water.laird=null; water.shark=null;
  water.sharkT=ri(620,1100); water.huiT=ri(260,480); water.pro=null; water.proT=ri(360,700);
  setMsg("Paddle out (↑). Line up wit' a swell → SPACE drop-in",160);
}

// waves live independent of the scene so the swell keeps rolling even on the beach
function tickWaves(){
  const w=water;
  if(w.waveT>0)w.waveT--; else {
    const messy=Math.random()<0.26;
    w.waves.push({ y:SEATOP+10, x:rnd(60,W-60), len:rnd(70,150), spd:rnd(0.16,0.32), messy, rode:false });
    w.waveT=ri(90,180);
  }
  // waves that reach the shoreline CRASH: spawn a whitewater burst, then remove them
  for(const wv of w.waves){
    if(!wv.crashed && wv.y>=SHORE-6){
      wv.crashed=true;
      spawnCrash(wv.x, wv.len, wv.messy);
      beep(wv.messy?150:220, .18, 'sawtooth', .03);   // shorebreak thud
    }
  }
  for(const wv of w.waves) wv.y+=wv.spd*(w.surfing&&w.cur===wv?1.4:1);
  w.waves=w.waves.filter(wv=>wv.y<SHORE-4);           // gone once it breaks on the sand
  // advance crash foam
  for(const c of w.crashes){ c.life--; c.r+=1.4; }
  w.crashes=w.crashes.filter(c=>c.life>0);
}
function spawnCrash(x,len,messy){
  // a line of foam puffs along the shoreline where the wave broke
  const half=len/2, n=Math.max(5,(len/14)|0);
  for(let i=0;i<n;i++){
    water.crashes.push({ x:x-half + (i/(n-1))*len, y:SHORE-4,
      r:rnd(1,3), life:ri(18,30), messy });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(){
  frame++; seaPhase++; music();
  if(msgT>0)msgT--; if(flashT>0){ flashT--; flash.y-=0.4; }
  if(consume('mute')){ muted=!muted; setMsg(muted?"🔇 muted":"🔊 sound on",60); }
  if(beachBuilt||state==='beach'||state==='water') tickWaves();  // swell keeps rolling in every scene
  if(beachBuilt) tickBuggy();  // lifeguard ATV keeps driving even while you surf
  if(beachBuilt) tickLocal();  // a local strolls the beach ~1/min and drops stuff
  if(beachBuilt) tickTourist();  // a lone original tourist wanders by
  if(beachBuilt) tickRoad();     // cars + cyclists on the road behind the RCVA house
  if(state==='splash'){ if(consume('enter')){ state='help'; beep(660,.1);} else if(consume('space')){ enterBeach(); } return; }
  if(state==='help'){ if(consume('enter')||consume('space')){ enterBeach(); } return; }
  if(state==='gameover'){ if(consume('enter')||consume('space')){ score=0; state='splash'; } return; }
  if(state==='shop'){ updShop(); return; }
  if(state==='beach') updBeach(); else if(state==='water') updWater();
}

/* ---- SHOP: simple buy menu overlaid on the beach ---- */
let shop={ sel:0 };
function openShop(){ state='shop'; shop.sel=0; beep(680,.09,'triangle'); }
function updShop(){
  if(consume('b')||consume('enter')&&false){}
  if(consume('up'))   shop.sel=(shop.sel+SHOP.length-1)%SHOP.length;
  if(consume('down')) shop.sel=(shop.sel+1)%SHOP.length;
  if(consume('left')) shop.sel=(shop.sel+SHOP.length-1)%SHOP.length;
  if(consume('right'))shop.sel=(shop.sel+1)%SHOP.length;
  if(consume('b')||consume('space')){ state='beach'; return; }   // close
  if(consume('enter')){ buy(SHOP[shop.sel]); }
}
function buy(item){
  if(item.kind==='treat'){
    if(coins>=item.price){ coins-=item.price; setCoins(coins); score+=25; floatScore('+25 ONO!',W/2,60,C.good); beep(900,.1); }
    else beep(160,.12,'sawtooth');
    return;
  }
  const have=owned.includes(item.id);
  if(!have){
    if(coins>=item.price){ coins-=item.price; setCoins(coins); owned.push(item.id); saveOwned(owned); beep(880,.1); }
    else { beep(160,.12,'sawtooth'); return; }  // can't afford
  }
  // own it → equip it
  equip[item.kind]=item.id; saveEquip(equip); applyEquip(); beep(760,.08,'triangle');
}

function updBeach(){
  const b=beach, sp=1.5;
  if(player.hitCool>0) player.hitCool--;
  if(b.screen===SCR.HOUSE && player.knockT===0 && player.hitCool===0){   // run over by traffic on the road
    const ry=HOUSE_ROAD_Y;
    for(const c of b.cars){
      const r = c.kind==='car' ? [c.x-15,ry-6,c.x+15,ry+10] : [c.x-11,ry-2,c.x+11,ry+9];
      if(feetHit(player.x,player.y,[r])){
        player.knockT=180; player.hitCool=360; beep(90,.4,'sawtooth',.06);
        setMsg(c.kind==='car'?"💥 A car wen' hit you! Out cold fo' 3 seconds...":"💥 Cyclist wen' bowl you ovah! Out cold fo' 3 seconds...",180);
        break;
      }
    }
  }
  if(player.knockT>0){            // knocked out by the ATV — no control (buggy still rolls via tickBuggy)
    player.knockT--;
    return;
  }
  const ox0=player.x, oy0=player.y;
  if(keys.left){ player.x-=sp; player.facing=-1; }
  if(keys.right){ player.x+=sp; player.facing=1; }
  if(keys.up) player.y-=sp;
  if(keys.down) player.y+=sp;
  { // solid obstacles: slide along them, never through (axis-by-axis; free if already overlapping)
    const rs=solidsNow(), nx=player.x, ny=player.y;
    if(feetHit(nx,ny,rs) && !feetHit(ox0,oy0,rs)){
      if(!feetHit(nx,oy0,rs)){ player.x=nx; player.y=oy0; }          // slide along x
      else if(!feetHit(ox0,ny,rs)){ player.x=ox0; player.y=ny; }     // slide along y
      else { player.x=ox0; player.y=oy0; }                           // stuck: stay put
    }
  }

  // ----- screen transitions (walk off an edge) -----
  if(b.screen===SCR.HOUSE){
    // Vertical street scene: BEACH edge up top → house → road → sidewalk + lawn at the bottom.
    // UP walks back toward the beach; DOWN walks deeper inland. You pop out by the house (top).
    player.x=clamp(player.x,10,W-10); player.y=clamp(player.y,SEATOP+10,H-10);
    if(b.scrLock>0){ b.scrLock--; }
    else if(player.y<=SEATOP+12 && keys.up){ b.screen=SCR.SURF; b.scrLock=10; player.x=clamp(player.x,20,W-20); player.y=H-30; setMsg("Back up to da surf beach.",90); beep(560,.07,'triangle'); return; }
  } else {
    // beach screens: ↑ at shoreline paddles out
    player.y=clamp(player.y,SHORE+4,H-14);
    if(b.scrLock>0){ b.scrLock--; }
    if(player.y<=SHORE+6 && keys.up && b.scrLock===0){ enterWater(); return; }
    // left/right edges move between TOWN(0) ◀ SURF(1) ▶ COVE(2)
    // trigger when you walk INTO the edge (not a pixel-exact test)
    if(player.x<=10 && keys.left){
      if(b.screen>SCR.TOWN){ b.screen--; player.x=W-24; announceScreen(); return; }
      player.x=10;  // western-most screen: wall
    }
    if(player.x>=W-10 && keys.right){
      if(b.screen<SCR.COVE){ b.screen++; player.x=24; announceScreen(); return; }
      player.x=W-10; // eastern-most screen: wall
    }
    player.x=clamp(player.x,10,W-10);
    // from the SURF beach, walk DOWN off the bottom → pop out AT the RCVA house (down top).
    if(b.screen===SCR.SURF && player.y>=H-14 && keys.down && b.scrLock===0){ b.screen=SCR.HOUSE; b.scrLock=10; player.x=W/2-80; player.y=SEATOP+18; setMsg("⬇ Down da beach to da RCVA house",110); beep(560,.07,'triangle'); return; }
  }

  // ----- per-screen interactions -----
  if(b.screen===SCR.SURF){
    if(player.injured && near(player.x,player.y,b.chandler.x,b.chandler.y+6,22)){
      player.recover++;
      if(player.recover>80){ player.injured=0; player.recover=0; beep(540,.14,'triangle');
        setMsg("Chandler: 'You good now, braddah. Surf wit' aloha.'",150); }
      else if(frame%30===0) setMsg("Chandler patching you up... hang loose",40);
    } else if(near(player.x,player.y,b.chandler.x,b.chandler.y+6,22)){
      if(b.chatCool>0) b.chatCool--;
      else { setMsg("Chandler: "+CHANDLER_LINES[ri(0,CHANDLER_LINES.length-1)],150);
        beep(500,.08,'triangle'); b.chatCool=260; }
    }
  }
  if(b.screen===SCR.TOWN){
    // SHOP: walk up to da shave-ice stand, press B
    if(near(player.x,player.y,b.iceShop.x,b.iceShop.y,24)){
      if(consume('b')){ openShop(); return; }
      else if(!msgT) setMsg("🍧 Shave Ice & Surf Shop — press B fo' shop",60);
    }
    // say HI to the locals
    for(const f of b.folks){ if(f.cool>0) f.cool--;
      if(near(player.x,player.y,f.x,f.y,18) && f.cool===0){
        setMsg("Local: "+GREETS[ri(0,GREETS.length-1)],130); beep(600,.07,'triangle'); f.cool=240; } }
  }
  consume('b'); // swallow stray B on other screens
  // props can be picked up on whichever beach screen they're on (surf/cove)
  if(b.screen===SCR.SURF || b.screen===SCR.COVE){
    for(const p of b.props){ if(!p.got && near(player.x,player.y,p.x,p.y,15)){
      p.got=true; score+=5; coins+=2; setCoins(coins); beep(760,.06); floatScore('+5',p.x,p.y-10,C.good);
      if(p.k==='slipper') setMsg("Found one lost slippah. Classic North Shore.",90);
      if(p.k==='honu') setMsg("A honu restin'. Give 'um space, yeah.",90);
      if(p.k==='cooler') setMsg("Cooler stay empty. Somebody wen' drink all da grindz.",90);
    }}
  }
  if(false){
  for(const p of b.props){ if(!p.got && near(player.x,player.y,p.x,p.y,15)){
    p.got=true; score+=5; coins+=2; setCoins(coins); beep(760,.06); floatScore('+5',p.x,p.y-10,C.good);
    if(p.k==='slipper') setMsg("Found one lost slippah. Classic North Shore.",90);
    if(p.k==='honu') setMsg("A honu restin'. Give 'um space, yeah.",90);
    if(p.k==='cooler') setMsg("Cooler stay empty. Somebody wen' drink all da grindz.",90);
  }}
  }
  // photographer: out only ~20% of the time. When his timer elapses, ROLL:
  // 20% he shows up (new spot, picked once), else he stays away for another window.
  // While he IS out we never touch his position — just count down his visit.
  if(b.photoT>0) b.photoT--;
  else if(!b.photographer){
    if(Math.random()<0.20){ b.photographer={x:rnd(140,340),y:H-60,t:ri(300,520)};
      setMsg("📷 Photographer on da beach — go score waves fo' DOUBLE points!",150); beep(880,.1); }
    else b.photoT=ri(260,520);   // keep him off the beach, try again later
  }
  if(b.photographer){ b.photographer.t--; if(b.photographer.t<0){ b.photographer=null; b.photoT=ri(300,560); } }
}

// the lifeguard ATV drives the beach independent of the scene, so it keeps
// rolling even while you're out in the water.
function tickBuggy(){
  const b=beach; if(!beachBuilt) return;
  if(b.buggyT>0)b.buggyT--; else if(!b.buggy){ b.buggy={x:-30}; }
  if(b.buggy){ b.buggy.x+=1.4; if(b.buggy.x>W+30){ b.buggy=null; b.buggyT=ri(380,760); }
    // ATV hits you -> knocked out ~3s, but only while you're ON the beach
    else if(state==='beach' && beach.screen!==SCR.HOUSE && player.knockT===0 && near(player.x,player.y,b.buggy.x,SHORE+16,16)){
      player.knockT=180; beep(90,.4,'sawtooth',.06);
      setMsg("💥 LIFEGUARD ATV wen' run you ovah! Out cold fo' 3 seconds...",180); } }
}

function photographerOut(){ return beach && beach.photographer; }

// cars + cyclists on the road behind the RCVA house (original simple vehicles)
function tickRoad(){
  const b=beach; if(!beachBuilt) return;
  if(b.roadT>0)b.roadT--; else {
    const fromLeft=Math.random()<0.5, kind=Math.random()<0.5?'car':'bike';
    b.cars.push({ kind, x:fromLeft?-30:W+30, dir:fromLeft?1:-1,
      col:['#d13a3a','#3a7ad1','#efc13a','#3aa050','#dddddd'][ri(0,4)] });
    b.roadT=ri(90,220);
  }
  for(const c of b.cars) c.x += (c.kind==='car'?2.2:1.2)*c.dir;
  b.cars=b.cars.filter(c=>c.x>-40 && c.x<W+40);
}
// a lone beach tourist (original character) occasionally strolls across
function tickTourist(){
  const b=beach; if(!beachBuilt) return;
  if(!b.tourist){
    if(b.touristT>0){ b.touristT--; return; }
    const fromLeft=Math.random()<0.5;
    b.tourist={ x:fromLeft?-20:W+20, dir:fromLeft?1:-1, y:SHORE+ri(20,H-SHORE-18) };
  } else {
    const T=b.tourist; T.x+=0.8*T.dir;   // just strolls across, no banner
    if(T.x<-30||T.x>W+30){ b.tourist=null; b.touristT=ri(1200,2400); }
  }
}
function drawTourist(T){
  softShadow(T.x,T.y+13,9);
  const fx=T.dir<0?-1:1;
  ctx.save(); ctx.translate(T.x|0,T.y|0); ctx.scale(fx,1);
  const step=(frame>>2)%2?2:0;
  // lounge tourist: loud aloha shirt, shorts, sun hat, camera round the neck — all original
  px(-4,7,3,6-step,'#c8bfa0'); px(1,7,3,6+step,'#c8bfa0'); px(-5,13,5,2,'#6a4a2a'); px(1,13,5,2,'#6a4a2a'); // shorts + sandals
  px(-6,-4,12,11,'#1f9e6a'); px(-6,-4,4,11,'#2fc488'); px(2,-4,4,11,'#157a50');  // aloha shirt hi+shadow
  px(-5,-2,3,2,'#ffd23f'); px(1,0,3,2,'#ff6b6b'); px(-2,2,3,2,'#ffd23f');        // loud shirt pattern
  px(-8,-2,3,7,'#1f9e6a'); px(5,-2,3,7,'#1f9e6a');                               // sleeves/arms
  px(-2,-1,4,2,'#111'); px(-1,0,2,3,'#333');                                     // camera on the chest
  px(-3,-12,7,8,'#d49a5e'); px(-3,-12,3,8,shade('#d49a5e',22)); px(2,-12,2,8,shade('#d49a5e',-24)); // head 3-tone
  px(-5,-13,11,3,'#efe4c0'); px(-5,-13,11,1,'#fff');                             // sun hat brim + lit top
  ctx.restore();
}

// a local walks down the beach every ~1 min and leaves a couple things behind
function tickLocal(){
  const b=beach; if(!beachBuilt) return;
  if(!b.local){
    if(b.localT>0){ b.localT--; return; }
    // enter from a random side, carrying 1-2 things to drop as they stroll
    const fromLeft=Math.random()<0.5;
    b.local={ x: fromLeft?-20:W+20, dir: fromLeft?1:-1,
      y: SHORE + ri(24, H-SHORE-20),
      drops: ri(1,2), nextDrop: ri(40,110) };
  } else {
    const L=b.local; L.x += 0.9*L.dir;
    // drop a thing as they walk (sandal or cooler), becomes a pickup — max 3 of each kind
    if(L.drops>0){ L.nextDrop--; if(L.nextDrop<=0){
      const countNotGot = k => b.props.filter(p=>p.k===k && !p.got).length;
      const want = Math.random()<0.5 ? 'slipper' : 'cooler';
      const other = want==='slipper' ? 'cooler' : 'slipper';
      // pick the preferred kind if under cap, else the other if under cap, else skip
      const k = countNotGot(want)<3 ? want : countNotGot(other)<3 ? other : null;
      if(k){ b.props.push({ k, x:clamp(L.x,24,W-24), y:L.y+6 }); beep(600,.05,'triangle'); }
      L.drops--; L.nextDrop=ri(80,160); } }
    if(L.x<-30||L.x>W+30){ b.local=null; b.localT=ri(2400,3600); }  // gone; next in ~1 min
  }
}

function updWater(){
  const w=water;
  // spawn swell lines moving toward shore (y grows downward = toward beach)
  if(player.invuln>0) player.invuln--;
  if(player.trickT>0) player.trickT--;
  for(const s of w.spray){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.22; s.life--; }
  w.spray=w.spray.filter(s=>s.life>0);
  if(player.downT>0){ player.downT--; if(player.downT===0 && player.y>SEABOT-4) { } return; }

  const paddling=!w.surfing;
  const sp=w.surfing?2.4:1.6;
  if(keys.left){ player.x-=sp; if(paddling)player.facing=-1; }
  if(keys.right){ player.x+=sp; if(paddling)player.facing=1; }
  if(paddling){ if(keys.up)player.y-=1.5; if(keys.down)player.y+=1.5; }
  player.x=clamp(player.x,14,W-14);
  player.y=clamp(player.y,SEATOP+6,SEABOT);

  // go to beach from the inside
  if(!w.surfing && keys.down && player.y>=SEABOT-1){ enterBeach(player.injured?"Limp in fo' heal, braddah":"Pau surf. Back on da sand."); return; }

  // drop-in: must be close to a clean swell line
  if(!w.surfing && consume('space')){
    const reach = player.longboard ? 22 : 14;   // longboard perk: easier to catch a swell
    const wv=w.waves.find(v=>!v.rode && Math.abs(v.y-player.y)<reach && Math.abs(v.x-player.x)<v.len/2+10);
    if(wv){ if(wv.messy){ wipeout("Messy closeout wen' buss you up!"); }
      else { w.surfing=true; w.cur=wv; wv.rode=true; w.ride=0; w.combo=0; w.style=0; beep(600,.1,'sawtooth');
        setMsg("DROP IN! ← → carve · Z cutback · X off-da-lip · Z+X barrel",120); } }
    else setMsg("No swell right dea — paddle onto a wave line, cuz",60);
  }

  if(w.surfing){
    // you're only surfing while you're ON your wave. The instant it's gone or you've
    // slid off its face, the ride ends and you're paddling again — no phantom standing.
    const onWave = w.cur && w.waves.includes(w.cur)
                && w.cur.y < SHORE-4
                && player.x > w.cur.x - w.cur.len/2 - 10
                && player.x < w.cur.x + w.cur.len/2 + 10;
    if(!onWave){ endRide(); }
    else {
      w.ride++; score+=1;
      player.y=w.cur.y;                         // ride the face in
      player.x += (w.cur.x - player.x)*0.04;    // get gently pulled along the wave
      if(frame%5===0) beep(280+Math.min(w.ride,220),.02,'sine',.012);
      // tricks — capture each key ONCE, then decide (fixes Z being eaten by &&)
      const zHit=consume('z'), xHit=consume('x');
      if(zHit&&xHit) trick('BARREL!!',120,C.purp);
      else if(zHit) trick('Cutback!',40,C.good);
      else if(xHit) trick('Off-da-lip!',45,C.gold);
      // kick out on purpose, or ride into the shorebreak
      if(player.y>=SHORE-8 || consume('space')){ endRide(); }
    }
  }

  // HUI
  if(w.huiT>0)w.huiT--; else if(w.huis.length<2){
    w.huis.push({ x:rnd(W*0.45,W-30), y:ri(SEATOP+14,SEABOT-16), vx:rnd(-0.25,0.25), vy:rnd(0.08,0.22) });
    w.huiT=ri(320,560); setMsg("⚠️ Da HUI stay in da water — keep your distance!",130); beep(160,.2,'sawtooth'); }
  for(const h of w.huis){
    if(h.surf){ // riding a wave in
      if(h.wave && w.waves.includes(h.wave)){ h.y=h.wave.y; h.x+=h.vx*0.4;
        h.x=clamp(h.x, h.wave.x-h.wave.len/2+8, h.wave.x+h.wave.len/2-8); }  // stay on the face
      else { h.surf=false; h.wave=null; }
      if(h.y>=SEABOT-6){ h.surf=false; h.wave=null; h.y=SEATOP+12; h.x=rnd(40,W-40); }
    } else {
      h.x+=h.vx; h.y+=h.vy;
      if(h.x<16||h.x>W-16)h.vx*=-1; if(h.y>SEABOT-6){ h.y=SEATOP+12; h.x=rnd(40,W-40); }
      // actively hunt a clean wave: drift toward the nearest crest, then grab it
      let best=null, bd=1e9;
      for(const v of w.waves){ if(v.messy||v===w.cur) continue;
        if(h.x>v.x-v.len/2-20 && h.x<v.x+v.len/2+20){ const d=Math.abs(v.y-h.y); if(d<bd){ bd=d; best=v; } } }
      if(best){ h.y += Math.sign(best.y-h.y)*0.5;   // paddle to meet the wave
        if(bd<14 && Math.random()<0.8){ h.surf=true; h.wave=best; } }
    }
    if(player.downT===0 && player.invuln===0 && near(player.x,player.y,h.x,h.y,15)){
      wipeout("Da Hui wen' knock you off! Respect da lineup.");
      // bump apart so you don't get stuck in a knock-down loop
      player.y=clamp(player.y+24,SEATOP+6,SEABOT);
      player.x=clamp(player.x+(player.x<h.x?-26:26),14,W-14);
      h.y=clamp(h.y-18,SEATOP+12,SEABOT-6); h.surf=false; h.wave=null;
      player.invuln=90;  // ~1.5s grace to paddle clear
    } }

  // FAMOUS SURFER — one at a time (Laird is in the roster). Cocky, snakes your wave, no damage.
  if(w.proT>0)w.proT--; else if(!w.pro){
    const p=PROS[ri(0,PROS.length-1)];
    w.pro={ name:p.name, line:p.line, female:!!p.female, x:rnd(60,W-60), y:SEATOP+12, t:ri(360,560), surf:false, wave:null };
    setMsg(p.name+" paddling out — "+p.line,140); beep(520,.1,'triangle'); }
  if(w.pro){ const L=w.pro; L.t--;
    if(L.surf){
      if(L.wave && w.waves.includes(L.wave)){ L.y=L.wave.y; L.x+=Math.sin(frame*0.1)*0.8;
        L.x=clamp(L.x, L.wave.x-L.wave.len/2+8, L.wave.x+L.wave.len/2-8); }  // stay on the face
      else { L.surf=false; L.wave=null; }
      if(L.y>=SEABOT-6){ L.surf=false; L.wave=null; }
    } else {
      L.y+=0.22;
      // hunt the nearest clean wave and drop in readily — pros neva miss
      let best=null, bd=1e9;
      for(const v of w.waves){ if(v.messy||v===w.cur) continue;
        if(L.x>v.x-v.len/2-20 && L.x<v.x+v.len/2+20){ const d=Math.abs(v.y-L.y); if(d<bd){ bd=d; best=v; } } }
      if(best){ L.y += Math.sign(best.y-L.y)*0.6;
        if(bd<14 && Math.random()<0.85){ L.surf=true; L.wave=best; setMsg(L.name+" droppin' in — "+L.line,110); } }
    }
    if(near(player.x,player.y,L.x,L.y,15)&&w.surfing){
      setMsg(L.name+" SNAKED your wave! 'Did you see that one?!'",110);
      player.x=clamp(player.x+(player.x<L.x?-22:22),20,W-20); }
    if(L.t<0||L.y>SEABOT){ w.pro=null; w.proT=ri(260,520); } }

  // SHARK
  if(w.sharkT>0)w.sharkT--; else if(!w.shark){ w.shark={x:-24,y:ri(SEATOP+24,SEABOT-16),vx:rnd(0.5,0.85)};
    beep(80,.5,'sawtooth',.06); setMsg("🦈 SHARK!! Get to shore, braddah!",160); }
  if(w.shark){ w.shark.x+=w.shark.vx;
    if(near(player.x,player.y,w.shark.x,w.shark.y,16)&&!player.injured){
      player.injured=1; beep(60,.6,'sawtooth',.07);
      setMsg("Shark wen' buss you up! Paddle in, find Chandler.",180);
      w.surfing=false; w.cur=null; player.downT=36; }
    if(w.shark.x>W+30) w.shark=null; }
}

function trick(name,pts,col){ const w=water; w.combo++; w.style+=pts;
  score+=pts*w.combo; floatScore((w.combo>1?('x'+w.combo+' '):'')+name,player.x,player.y-16,col);
  beep(880+w.combo*50,.08,'square');
  // drive the trick animation: distinct pose + spray burst
  player.trickKind = name.startsWith('BARREL')?'barrel' : name.startsWith('Off')?'lip' : 'cut';
  player.trickT = player.trickKind==='barrel'?34:22;
  spawnSpray(player.x, player.y, player.trickKind); }
function spawnSpray(x,y,kind){
  const n = kind==='barrel'?16:9;
  for(let i=0;i<n;i++) water.spray.push({ x, y:y-4,
    vx:rnd(-2.6,2.6), vy:rnd(-3.2,-0.6), life:ri(16,30), kind }); }
function endRide(){ const w=water; if(!w.surfing)return;
  let bonus=Math.floor(w.ride*0.6)+w.style, note="Nice ride! "+w.ride+" frames";
  if(photographerOut()){ bonus*=2; note="📷 PHOTO SCORE! DOUBLE — "+w.ride+" frames"; beep(990,.14); }
  score+=bonus; floatScore('+'+bonus,player.x,player.y-18,C.gold);
  // earn shop coins = ~40% of the ride bonus
  const earn=Math.max(1,Math.floor(bonus*0.4)); coins+=earn; setCoins(coins);
  setMsg(note+(w.combo>1?(" · "+w.combo+"x combo!"):"")+"  🪙+"+earn,130);
  w.surfing=false; w.cur=null; w.ride=0; w.combo=0; w.style=0;
  // kick back out to the lineup, prone and paddling — no lingering stand
  player.y=clamp(player.y-28, SEATOP+20, SEABOT-20);
  player.trickT=0; player.trickKind='';
  if(score>high){ high=score; setHS(high); floatScore('NEW BEST!',W/2,40,C.purp); }
}
function wipeout(reason){ const w=water;
  // rashguard perk: shrug off ONE wipeout, then it's spent until you go ashore
  if(player.tough && !player.shieldUsed){ player.shieldUsed=true; w.combo=0;
    floatScore('RASHGUARD SAVE!',player.x,player.y-18,C.good); beep(520,.12,'triangle');
    setMsg("Rashguard saved you — keep ripping!",90); return; }
  w.surfing=false; w.cur=null; w.ride=0; w.combo=0; w.style=0;
  player.downT=48; setMsg(reason||"WIPEOUT! Worked in da impact zone.",120); beep(130,.28,'sawtooth');
  if(score>high){ high=score; setHS(high); } }

}

const HOUSE_ROAD_Y = SEATOP+92;   // keep in sync with drawHouseScreen's roadY

function solidsNow(){
  const b=beach, out=[];
  if(b.screen===SCR.HOUSE){
    const ry=HOUSE_ROAD_Y;
    out.push([W/2-54,100,W/2+54,164]);                          // the RCVA house

    out.push([W-70-4,ry-8,W-70+10,ry+2]);                         // tall palm (right)
    out.push([16,ry-12,W/2-22,ry]); out.push([W/2+16,ry-12,W-16,ry]); // stone wall (gate gap in the middle)

function drawWaves(){
  const w=water;
  for(const wv of w.waves){
    const half=wv.len/2, x0=wv.x-half;
    const riding=w.surfing&&w.cur===wv;
    // sample a gentle arc so the crest curves instead of a flat bar
    for(let i=0;i<wv.len;i+=3){
      const t=i/wv.len;                    // 0..1 across the wave
      const arc=Math.sin(t*Math.PI)*3;     // peak in the middle
      const x=x0+i, yc=wv.y-arc;
      const faceCol = wv.messy ? '#6fa6b8' : (riding?'#6fd6e6':C.sea3);
      const lipCol  = wv.messy ? '#dfeef2' : C.foam;
      px(x, yc+2, 3, 5, shade(faceCol,-18));  // lower face (shadow)
      px(x, yc,   3, 3, faceCol);             // mid face
      px(x, yc-2, 3, 2, lipCol);              // breaking lip
      if(!wv.messy && (i%9===0)) px(x, yc-4, 2, 2, '#fff');  // foam flecks on the crest
    }
    if(wv.messy){ // whitewater chop on a closeout
      for(let i=-half;i<half;i+=7) px(wv.x+i, wv.y-6+Math.sin((i+frame)*0.3)*2, 5, 3, '#fff');
    }
    if(riding){ // lit-up ridable face glowing under the board
      px(x0,wv.y+5,wv.len,2,'#aef'); px(x0,wv.y+7,wv.len,1,'#6cf');
    }
  }
  // shorebreak CRASH foam — bursts along the sand where waves broke
  for(const c of w.crashes){
    const a=c.life/30, r=c.r|0;
    const col = c.messy ? '#dfeef2' : '#fff';
    px(c.x-r, c.y-2, r*2, 3, col);                 // spreading foam line
    px(c.x-(r>>1), c.y-4-(a*3|0), Math.max(2,r), 2, col); // upward splash puff
    if(c.life>18) px(c.x-1, c.y-6-(a*4|0), 2, 2, col);    // flung droplet
  }
}

  px(x-9,y-26,18,4,'#111'); ctx.fillStyle=C.bad; ctx.font='7px monospace'; ctx.textAlign='center';
  ctx.fillText('HUI',x,y-29); ctx.textAlign='left'; }

function drawShop(){
  // dim the beach behind the menu
  ctx.save(); ctx.globalAlpha=0.72; px(0,0,W,H,'#0a0618'); ctx.restore();
  const bw=320, bh=236, bx=(W-bw)/2, by=(H-bh)/2;
  px(bx,by,bw,bh,'#14233a'); ctx.strokeStyle=C.good; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
  // striped header like the awning
  for(let i=0;i<bw/10;i++) px(bx+i*10,by,10,10,i%2?'#ff5a7a':'#fff');
  ctx.textAlign='center'; ctx.fillStyle='#14233a'; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText('SHAVE ICE & SURF SHOP',W/2,by+8);
  ctx.fillStyle=C.gold; ctx.font='bold 11px "Courier New",monospace';
  ctx.fillText('🪙 '+coins+' coins',W/2,by+24);
  ctx.font='9px "Courier New",monospace'; ctx.textAlign='left';
  let yy=by+38;
  for(let i=0;i<SHOP.length;i++){
    const it=SHOP[i], isSel=i===shop.sel;
    const ownedIt = it.kind==='treat' ? false : owned.includes(it.id);
    const equipped = it.kind!=='treat' && equip[it.kind]===it.id;
    if(isSel){ px(bx+6,yy-8,bw-12,13,'#24456a'); }
    if(it.color && it.color!=='none') px(bx+12,yy-6,9,9,it.color); else px(bx+12,yy-6,9,9,'#334');
    ctx.fillStyle = isSel?C.gold:C.txt;
    let label=it.name;
    if(it.perk==='longboard') label+=' ·catches easier';
    if(it.perk==='tough') label+=' ·+1 hit';
    ctx.fillText(label, bx+26, yy+1);
    ctx.textAlign='right';
    const right = equipped ? 'EQUIPPED' : ownedIt ? 'owned·ENTER' : (it.price===0?'free':('🪙'+it.price));
    ctx.fillStyle = equipped?C.good : ownedIt?'#8fb' : (coins>=it.price?C.gold:C.bad);
    ctx.fillText(right, bx+bw-12, yy+1);
    ctx.textAlign='left';
    yy+=15;
  }
  ctx.textAlign='center'; ctx.fillStyle='#8fb'; ctx.font='8px "Courier New",monospace';
  ctx.fillText('up/down choose · ENTER buy/equip · B close',W/2,by+bh-8);
  ctx.textAlign='left';
}

function drawHUD(){
  px(0,0,W,16,'#00000059');
  ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='left';
  ctx.fillStyle=C.gold; ctx.fillText('SCORE '+score,6,12);
  ctx.textAlign='right'; ctx.fillStyle=C.good; ctx.fillText('BEST '+high,W-6,12);
  ctx.textAlign='center'; ctx.fillStyle=C.txt; ctx.fillText(state==='beach'?'🏖 BEACH':'🌊 LINEUP',W/2,12);
  ctx.textAlign='left'; ctx.fillStyle=C.gold; ctx.font='bold 10px "Courier New",monospace';
  ctx.fillText('🪙 '+coins, 92, 12);
  ctx.font='bold 11px "Courier New",monospace';
  if(state==='water'&&water.surfing){ ctx.fillStyle=C.purp; ctx.fillText('RIDE '+water.ride+(water.combo>1?('  x'+water.combo):''),W/2,28); }
  if(player.injured){ ctx.fillStyle=C.bad; ctx.textAlign='center'; ctx.fillText('🩹 HURT — heal at Chandler on da beach',W/2, state==='water'?44:28); }
  if(flashT>0&&flash){ ctx.fillStyle=flash.col; ctx.font='bold 11px monospace'; ctx.textAlign='center'; ctx.fillText(flash.txt,flash.x,flash.y); }
  ctx.textAlign='left';
}
function drawBanner(){
  if(msgT<=0||!msg)return;
  ctx.font='10px "Courier New",monospace'; ctx.textAlign='center';
  const w=ctx.measureText(msg).width+16, a=Math.min(1,msgT/20);
  ctx.globalAlpha=.82*a; px(W/2-w/2,H-22,w,15,'#0a0618');
  ctx.globalAlpha=a; ctx.fillStyle=C.good; ctx.fillText(msg,W/2,H-11);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ---- loop ---- */
function loop(){ update(); ctx.clearRect(0,0,W,H); render(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
