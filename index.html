<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>North Shore — Soul Surf</title>
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#140a20" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Soul Surf" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    height:100%; width:100%; background:#140a20; color:#ffe9c7;
    font-family:"Courier New",monospace; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #wrap { position:relative; width:100%; height:100%;
          display:flex; align-items:center; justify-content:center; }
  canvas { display:block; image-rendering:pixelated;
           box-shadow:0 0 0 3px #5de0c4, 0 6px 44px rgba(0,0,0,.65); border-radius:4px; }
  #hint { position:absolute; left:0; right:0; bottom:6px; text-align:center;
          font-size:11px; letter-spacing:1px; color:#8fb; opacity:.6;
          text-shadow:0 1px 2px #000; pointer-events:none; }
  @media (max-width:640px){ #hint{ display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="320"></canvas>
</div>
<script>
"use strict";
/* ============================================================
   NORTH SHORE — SOUL SURF  (v2)
   One-file 16-bit surf game. Canvas + vanilla JS, art in code.
   No winners/losers. localStorage high score. 100% offline.
   Homage to NORTH SHORE (1987). Likeness: full copy, Matt's call.
   ============================================================ */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
ctx.imageSmoothingEnabled = false;

/* ---- responsive scaling: fill the window, minimal wasted space ---- */
function fit(){
  const mw = innerWidth, mh = innerHeight;
  // largest scale that fits either dimension (fractional) — fills the window
  const s = Math.min(mw/W, mh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize', fit);
addEventListener('load', fit);
fit();

/* ---- palette ---- */
const C = {
  skyTop:'#2b1a4a', s1:'#5a2a6b', s2:'#b34a7a', s3:'#e8683f', s4:'#f59a3c', s5:'#ffc94d',
  sun:'#ffe08a', sunCore:'#fff3c4',
  seaDeep:'#10395a', sea1:'#1c6a8c', sea2:'#2f93aa', sea3:'#4fb4c4', foam:'#eafcff',
  sand:'#e9cf8f', sandDot:'#d8b66f', sandWet:'#c9a85f',
  mtnA:'#2d5a3f', mtnB:'#3f2a56',
  skin:'#c88a4e', hair:'#2a1a12',
  huiSkin:'#9a5a2e', hui:'#3a2a44',
  shark:'#5a6b78', sharkBelly:'#cdd8de',
  txt:'#ffe9c7', good:'#5de0c4', bad:'#ff6b6b', gold:'#ffd27f', purp:'#c9a0ff'
};

/* ---- input ---- */
const keys={}, pressed={};
addEventListener('keydown',e=>{ const k=norm(e); if(k){ if(!keys[k])pressed[k]=true; keys[k]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault(); if(!actx)initAudio(); }});
addEventListener('keyup',e=>{ const k=norm(e); if(k)keys[k]=false; });
function norm(e){ switch(e.key){
  case 'ArrowLeft':case 'a':case 'A':return 'left';
  case 'ArrowRight':case 'd':case 'D':return 'right';
  case 'ArrowUp':case 'w':case 'W':return 'up';
  case 'ArrowDown':case 's':case 'S':return 'down';
  case ' ':return 'space'; case 'Enter':return 'enter';
  case 'z':case 'Z':return 'z'; case 'x':case 'X':return 'x';
  case 'b':case 'B':return 'b';
  case 'n':case 'N':return 'newgame';
  case 'i':case 'I':return 'inspect';
  case 'q':case 'Q':return 'quest';
  case 'm':case 'M':return 'mute'; default:return null; } }
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }

/* ---- touch ---- */
cv.addEventListener('touchstart',t=>{ onTouch(t); if(!actx)initAudio(); },{passive:false});
cv.addEventListener('touchmove',onTouch,{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); keys.left=keys.right=keys.up=false;
  pressed.space=true; if(state==='splash'||state==='help')pressed.enter=true; },{passive:false});
function onTouch(e){ e.preventDefault(); const r=cv.getBoundingClientRect(), t=e.touches[0]; if(!t)return;
  const x=(t.clientX-r.left)/r.width, y=(t.clientY-r.top)/r.height;
  keys.left=x<.34; keys.right=x>.66; keys.up=y<.4; keys.down=y>.82; }

/* ---- audio ---- */
let muted=false, actx=null, musicGain=null;
function initAudio(){ try{ actx=new (AudioContext||webkitAudioContext)();
  musicGain=actx.createGain(); musicGain.gain.value=0.0; musicGain.connect(actx.destination); startMusic(); }catch(e){} }
function beep(f=440,d=.08,type='square',v=.05){ if(muted||!actx)return;
  try{ const o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f;
    o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
/* ---- MIDI-style chiptune: surf-rock / island groove (original tune) ----
   Web Audio step sequencer scheduled ahead on the audio clock so the tempo never drifts with frame rate.
   I-vi-IV-V in G, 16 steps per bar, 4 bars, then a B-section; square lead, triangle bass, pulse chords,
   noise hats + sine kick. */
const BPM=112, STEP=60/BPM/4;                                    // 16th-note length in seconds
const N=(m)=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[55,59,62],[52,55,59],[48,52,55],[50,54,57],       // A: G  Em  C  D
              [48,52,55],[50,54,57],[52,55,59],[50,54,57]];      // B: C  D   Em D
const _=null;
const LEAD=[                                                      // 8 bars x 16 steps (MIDI numbers, null = rest)
  74,_,71,_, 74,_,76,_, 74,_,71,_, 67,_,_,_,     71,_,67,_, 71,_,74,_, 72,_,71,_, 67,_,_,_,
  72,_,76,_, 79,_,76,_, 74,_,72,_, 71,_,_,_,     69,_,72,_, 74,_,72,_, 69,_,66,_, 69,_,74,_,
  76,_,_,79, 76,_,74,_, 72,_,_,_, 76,_,74,_,     74,_,_,78, 74,_,72,_, 69,_,_,_, 66,_,69,_,
  71,_,74,_, 79,_,78,_, 76,_,74,_, 71,_,_,_,     74,_,72,_, 69,_,66,_, 67,_,_,_, _,_,_,_ ];
let musicStep=0, nextNoteT=0, noiseBuf=null;
function startMusic(){ if(musicGain) musicGain.gain.value = muted?0:0.0; nextNoteT=actx?actx.currentTime+0.1:0; }
function tone(type,f,t,dur,vol){
  const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  o.connect(g); g.connect(musicGain);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02);
}
function hat(t,vol){
  if(!noiseBuf){ noiseBuf=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const src=actx.createBufferSource(), hp=actx.createBiquadFilter(), g=actx.createGain();
  src.buffer=noiseBuf; hp.type='highpass'; hp.frequency.value=7000; src.connect(hp); hp.connect(g); g.connect(musicGain);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.04); src.start(t); src.stop(t+0.05);
}
function kick(t){
  const o=actx.createOscillator(), g=actx.createGain(); o.type='sine';
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  o.connect(g); g.connect(musicGain); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.start(t); o.stop(t+0.18);
}
function playStep(k,t){
  const bar=Math.floor(k/16)%8, s16=k%16, ch=CHORDS[bar];
  const lead=LEAD[(k%128)];
  if(lead!==null) tone('square',N(lead),t,STEP*1.8,0.16);                         // lead melody
  if(s16%4===0) tone('triangle',N(ch[0]-12),t,STEP*1.9,0.55);                      // bass: root on da beat
  if(s16%4===2) tone('triangle',N(ch[0]-5),t,STEP*1.4,0.40);                       //       fifth on da "and"
  if(s16===4||s16===12) for(const m of ch) tone('square',N(m),t,STEP*1.2,0.045);  // offbeat chord stabs (ska/surf skank)
  if(s16%2===1) hat(t,0.12); else if(s16===0||s16===8) kick(t);                   // drums
  if(s16===4||s16===12) hat(t,0.22);                                               // backbeat snap
}
function music(){ if(!actx||muted){ if(musicGain)musicGain.gain.value=0; return; }
  musicGain.gain.value=0.11;
  if(nextNoteT<actx.currentTime-0.25) nextNoteT=actx.currentTime+0.05;          // tab was asleep: resync, don't burst
  while(nextNoteT < actx.currentTime+0.12){ playStep(musicStep,nextNoteT); nextNoteT+=STEP; musicStep++; } }

/* ---- high score ---- */
const HS='nsss_hi';
const getHS=()=>parseInt(localStorage.getItem(HS)||'0',10)||0;
const setHS=v=>{ try{localStorage.setItem(HS,String(v));}catch(e){} };

/* ---- wallet + owned/equipped gear (persisted) ---- */
const WALLET='nsss_coins', OWNED='nsss_owned', EQUIP='nsss_equip';
// ---- NEW GAME: wipe every save so you start over in Arizona ----
const SAVE_KEYS=['nsss_hi','nsss_coins','nsss_owned','nsss_equip','nsss_quest','nsss_xp','nsss_tank_done'];
function wipeSave(){ try{ for(const k of SAVE_KEYS) localStorage.removeItem(k); }catch(e){} }
// one-time reset Matt asked for (back to da start of Arizona); runs once per browser, before anything loads
try{ if(!localStorage.getItem('nsss_reset_v3')){ wipeSave(); localStorage.setItem('nsss_reset_v3','1'); } }catch(e){}
const getCoins=()=>parseInt(localStorage.getItem(WALLET)||'0',10)||0;
const setCoins=v=>{ try{localStorage.setItem(WALLET,String(v));}catch(e){} };
function loadOwned(){ try{ return JSON.parse(localStorage.getItem(OWNED)||'["board_teal","shorts_blue"]'); }catch(e){ return ['board_teal','shorts_blue']; } }
function saveOwned(a){ try{ localStorage.setItem(OWNED,JSON.stringify(a)); }catch(e){} }
function loadEquip(){ try{ return JSON.parse(localStorage.getItem(EQUIP)||'{"board":"board_teal","shorts":"shorts_blue","shirt":"none"}'); }catch(e){ return {board:'board_teal',shorts:'shorts_blue',shirt:'none'}; } }
function saveEquip(o){ try{ localStorage.setItem(EQUIP,JSON.stringify(o)); }catch(e){} }

/* ---- utils ---- */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const near=(ax,ay,bx,by,r)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy<r*r;};
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

const PLAYER_HAIR='#f0d470';   // you: short blond top
/* ============================================================
   SPRITES
   ============================================================ */
function drawDude(x,y,skin,trunks,facing,pose,t,shirt,hair){
  const hc = hair || C.hair;               // hair color (player passes short blond)
  const hasShirt = shirt && shirt!=='none';
  const fx=facing<0?-1:1;
  const skinD = shade(skin,-28);            // shadow tone
  ctx.save(); ctx.translate(x|0,y|0); ctx.scale(fx,1);
  if(pose==='down'){ px(-8,2,16,5,skin); px(-8,5,16,2,skinD); px(-6,-1,5,5,hc);
    const b=(t>>2)%2; px(-11,-6,3,3,b?C.gold:C.foam); px(9,-7,3,3,b?C.foam:C.gold); ctx.restore(); return; }
  const stride=pose==='walk'?Math.sin(t*0.35)*2:0;

  if(pose==='surf'||pose==='cut'||pose==='lip'||pose==='barrel'){
    const skinH=shade(skin,22), rim=shade(skin,14);   // highlight tone + soft rim (skin-toned, not yellow)
    // crouch amount + lean per trick
    let crouch=2, leanArmUp=false, tuck=false, lean=0;
    if(pose==='cut'){ crouch=4; lean=-3; }          // low carve, leaning back
    else if(pose==='lip'){ crouch=0; leanArmUp=true; } // standing tall, arm to the sky
    else if(pose==='barrel'){ crouch=6; tuck=true; }   // deep tuck
    // legs (bent, wide stance) — 3-tone
    px(-6,6,4,6,skin); px(-6,6,2,6,skinH); px(-6,9,4,3,skinD);
    px(2,6,4,6,skin);  px(2,6,2,6,skinH);  px(2,9,4,3,skinD);
    px(-8,11,7,3,'#1b2a33'); px(2,11,7,3,'#1b2a33');   // feet planted
    // trunks w/ waistband highlight + shadow stripe
    px(-4+lean,3-crouch,9,4,trunks); px(-4+lean,3-crouch,9,1,shade(trunks,36)); px(3+lean,3-crouch,1,4,shade(trunks,-34));
    // torso: shadow core, lit left, sunset rim on the sun side (right in local space)
    px(-4+lean,-4-crouch,9,8,skin); px(-4+lean,-4-crouch,3,8,skinH); px(1+lean,-4-crouch,4,8,skinD);
    px(5+lean,-4-crouch,1,8,rim);
    if(hasShirt){ px(-4+lean,-4-crouch,9,8,shirt); px(-4+lean,-4-crouch,3,8,shade(shirt,22)); px(1+lean,-4-crouch,4,8,shade(shirt,-22)); px(-4+lean,-4-crouch,9,1,shade(shirt,36)); }
    // arms per pose (3-tone)
    if(tuck){ px(-9+lean,-1-crouch,5,3,skin); px(5+lean,-1-crouch,5,3,skin); px(5+lean,-1-crouch,5,1,rim); }
    else if(leanArmUp){ px(-10+lean,-10-crouch,4,8,skin); px(-10+lean,-10-crouch,2,8,skinH); px(5+lean,-3-crouch,5,3,skin); }
    else { px(-11+lean,-3-crouch,6,3,skin); px(-11+lean,-3-crouch,6,1,skinH); px(5+lean,-6-crouch,6,3,skin); px(5+lean,-6-crouch,6,1,rim); }
    // head: lit crown, shadow jaw, rim on the sun side
    px(-3+lean,-11-crouch,7,7,skin); px(-3+lean,-11-crouch,3,7,skinH); px(1+lean,-11-crouch,3,7,skinD);
    px(-3+lean,-12-crouch,7,3,hc); if(!hair) px(-3+lean,-12-crouch,2,4,hc);   // custom hair = short crop, no long lock
    ctx.restore(); return;
  }
  if(pose==='paddle'){
    // prone, side-on: lying flat on the board, chest lifted, arms stroking forward
    const strokeF=Math.sin(t*0.35), strokeB=Math.sin(t*0.35+Math.PI);
    // legs/feet trailing back along the board
    px(-12,2,8,3,skin); px(-12,3,8,1,skinD);
    // hips + trunks
    px(-6,0,7,4,trunks); px(-6,0,7,1,shade(trunks,30));
    // torso lying flat, chest end lifted a touch
    px(0,-1,8,4,skin); px(0,2,8,1,skinD);
    if(hasShirt){ px(-1,-1,9,4,shirt); px(-1,-1,9,1,shade(shirt,30)); px(-1,2,9,1,shade(shirt,-26)); }
    // head up, looking forward over the nose of the board
    px(7,-3,5,5,skin); px(10,-3,2,5,skinD); px(7,-4,5,2,hc);
    // arms reaching ahead and down into the water, alternating stroke
    px(9,-1+strokeF*2,5,2,skin);   // forward (reaching) arm
    px(2,3+strokeB*2,5,2,skin);    // trailing (pulling) arm
    // little hand-splash at the stroking hand
    if(strokeF>0.6) px(13,2,3,2,C.foam);
    ctx.restore(); return;
  }
  // stand / walk — 3-tone with sunset rim
  const skinH2=shade(skin,22), rim2=shade(skin,14);
  px(-3,6,3,7+stride,skin); px(1,6,3,7-stride,skin);
  px(-3,13,4,2,'#1b2a33'); px(1,13,4,2,'#1b2a33');
  px(-4,3,9,4,trunks); px(-4,3,9,1,shade(trunks,36));
  px(-4,-4,9,8,skin); px(-4,-4,3,8,skinH2); px(1,-4,4,8,skinD); px(5,-4,1,8,rim2);
  px(-6,-3,3,6,skin); px(4,-3,3,6,skin); px(5,-3,2,6,rim2);
  if(hasShirt){ px(-4,-4,9,8,shirt); px(-4,-4,3,8,shade(shirt,22)); px(1,-4,4,8,shade(shirt,-22)); px(-4,-4,9,1,shade(shirt,36));
    px(-6,-3,3,2,shirt); px(4,-3,3,2,shade(shirt,-22)); }                    // short sleeves
  px(-3,-11,7,7,skin); px(-3,-11,3,7,skinH2); px(1,-11,3,7,skinD); px(-3,-12,7,3,hc);
  ctx.restore();
}
function shade(hex,amt){ // lighten(+)/darken(-) a #rrggbb
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=r<0?0:r>255?255:r; g=g<0?0:g>255?255:g; b=b<0?0:b>255?255:b;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function drawBoard(x,y,col,facing){
  const fx=facing<0?-1:1; ctx.save(); ctx.translate(x|0,y|0); ctx.scale(fx,1);
  px(-12,0,26,4,col); px(-12,0,26,1,shade(col,34)); px(-12,3,26,1,shade(col,-34)); // deck hi + rail shadow
  px(-12,1,26,1,'#fff'); px(11,1,5,3,col); px(13,1,2,2,shade(col,34)); ctx.restore();
}

/* ============================================================
   32-BIT RENDER HELPERS — gradient ramps, ordered dithering, soft shadow
   ============================================================ */
// 4x4 Bayer ordered-dither threshold matrix (0..15)
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dither(x,y,t){ return BAYER[(y&3)*4+(x&3)] < t*16; }
function lerpCol(a,b,t){ // blend two #rrggbb
  const na=parseInt(a.slice(1),16), nb=parseInt(b.slice(1),16);
  const r=Math.round(((na>>16)&255)*(1-t)+((nb>>16)&255)*t);
  const g=Math.round(((na>>8)&255)*(1-t)+((nb>>8)&255)*t);
  const bl=Math.round((na&255)*(1-t)+(nb&255)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
// vertical gradient band from colA(top) to colB(bottom), dithered at the seams
function gradBand(x,y,w,h,colA,colB,steps){
  steps=steps||h; const sh=Math.max(1,h/steps);
  for(let i=0;i<steps;i++){
    const t=i/(steps-1||1);
    px(x, y+i*sh, w, Math.ceil(sh)+1, lerpCol(colA,colB,t));
    // dither a 2px seam into the next tone for a smooth 32-bit blend
    if(i<steps-1){ const nc=lerpCol(colA,colB,(i+1)/(steps-1||1)); const yy=(y+i*sh+sh)|0;
      for(let xx=x;xx<x+w;xx+=2) if(dither(xx,yy,0.5)) px(xx,yy,1,1,nc); }
  }
}
function softShadow(x,y,w){ // elliptical drop shadow on the sand/water
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(x,y,w,w*0.35,0,0,Math.PI*2); ctx.fill(); ctx.restore();
}

/* ============================================================
   BACKGROUND
   ============================================================ */
let seaPhase=0;
function drawSky(){
  const S=skyNow();
  // time-of-day gradient
  gradBand(0,0,W,30, S.a, S.b, 9);
  gradBand(0,30,W,30, S.b, lerpCol(S.b,S.c,0.5), 9);
  gradBand(0,60,W,36, lerpCol(S.b,S.c,0.5), S.c, 10);
  // stars at night
  if(isNight()){
    for(let i=0;i<40;i++){ const x=(i*97+13)%W, y=(i*53+7)%70; if((i+(frame>>5))%4) px(x,y,1,1,'#fff'); }
    // moon instead of sun
    const mx=W*0.62, my=74; ctx.fillStyle='#dfe6ff'; ctx.beginPath(); ctx.arc(mx,my,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=S.a; ctx.beginPath(); ctx.arc(mx+5,my-3,10,0,Math.PI*2); ctx.fill(); // crescent
  } else {
    // sun — glow + core, tinted by time of day, alpha fades near night
    const sx=W*0.62, sy=80;
    ctx.save(); ctx.globalAlpha=0.16*S.sa; ctx.fillStyle=S.sun;
    ctx.beginPath(); ctx.arc(sx,sy,40,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=0.12*S.sa; ctx.beginPath(); ctx.arc(sx,sy,54,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalAlpha=S.sa;
    for(let r=26;r>=0;r-=2){ const t=r/26; ctx.fillStyle=lerpCol('#fff3c4',S.sun,t);
      ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  // soft stacked clouds (no hard edges)
  cloud(392,34); cloud(60,24); cloud(300,30);
  // birds, slow drift
  const bw=(frame*0.12)%40;
  px(150-bw,54,4,2,'#2a1a2a'); px(154-bw,53,3,2,'#2a1a2a');
  px(300-bw*0.6,46,4,2,'#2a1a2a'); px(304-bw*0.6,47,3,2,'#2a1a2a');
}
function cloud(x,y){

const SEATOP=96, SEABOT=252, SHORE=252;
function drawSeaBands(){
  // 32-bit translucent depth gradient: deep at the horizon → bright toward shore, dithered
  gradBand(0,SEATOP,W,(SEABOT-SEATOP)*0.5, C.seaDeep, C.sea1, 10);
  gradBand(0,SEATOP+(SEABOT-SEATOP)*0.5,W,(SEABOT-SEATOP)*0.5, C.sea1, C.sea3, 10);
  // subtle shimmer: translucent light streaks that bob in place
  ctx.save(); ctx.globalAlpha=0.5;
  for(let i=0;i<12;i++){
    const yy=SEATOP+8+i*11, bob=Math.sin(frame*0.03+i)*1;
    for(let x=(i*47)%90; x<W; x+=90){ px(x, yy+bob, 16, 1, lerpCol(C.sea3,C.foam,0.6)); }
  }
  ctx.restore();
  // sun glitter path — scattered sparkles that fan WIDER toward shore (no solid tube)
  const sx=W*0.62;
  for(let yy=SEATOP+2; yy<SEABOT; yy+=4){
    const depth=(yy-SEATOP)/(SEABOT-SEATOP);     // 0 at horizon, 1 at shore
    const spread=3 + depth*22;                   // fan out as it nears the beach
    const n=1+Math.round(depth*3);
    for(let k=0;k<n;k++){
      const jx = (Math.sin(yy*0.7 + k*2.3 + frame*0.03)* spread);
      const bright = (Math.sin(yy*1.3 + k + frame*0.08) > 0.1);
      if(bright) px(sx + jx - 2, yy, 4, 2, k%2? C.sunCore : '#ffd98a');
    }
  }
}
function drawSand(){
  // 32-bit sand: dithered wet-to-dry gradient down the beach
  gradBand(0,SHORE,W,H-SHORE, C.sandWet, C.sand, 8);
  // beveled shoreline: bright foam lip, then a wet-sand band, then dry sand
  px(0,SHORE-3,W,3,C.foam);
  px(0,SHORE,W,2,'#fff');
  px(0,SHORE+2,W,4,C.sandWet);
  // wet-sheen reflection just below the waterline (translucent)
  ctx.save(); ctx.globalAlpha=0.3; for(let x=0;x<W;x+=3) if(dither(x,SHORE+7,0.5)) px(x,SHORE+6,2,3,'#fff'); ctx.restore();
  // scalloped foam edge
  for(let x=0;x<W;x+=14) px(x+3,SHORE-4,8,2,C.foam);

  for(let i=0;i<150;i++){ const x=(i*53)%W, y=SHORE+10+((i*31)%(H-SHORE-12)); ctx.fillRect(x,y,2,2); }
}

// waves live independent of the scene so the swell keeps rolling even on the beach
function tickWaves(){
  const w=water;
  if(w.waveT>0)w.waveT--; else {
    // once in a while a ROGUE wave: ~2.5-3x TALLER (only ~1.5x wider), clean and ridable, and it just washes up harmless
    const F=waveFeel();
    const rogue = !w.waves.some(v=>v.big) && Math.random()<F.rogue;
    if(rogue){
      w.waves.push({ y:SEATOP+10, x:W/2+rnd(-60,60), len:rnd(180,240), spd:rnd(0.14,0.2), messy:false, rode:false, big:rnd(2.5,3) });   // ~3x a normal wave: big, not silly
      if(state==='water' || (state==='beach' && !IS_DOWN(beach.screen))){ setMsg("🌊 ROGUE WAVE! Da big one stay coming — go catch 'um!",200); beep(110,.5,'triangle',.06); }
      w.waveT=ri(240,360);
    } else {
      const messy=Math.random()<F.messy;
      w.waves.push({ y:SEATOP+10, x:rnd(60,W-60), len:rnd(F.len[0],F.len[1]), spd:rnd(F.spd[0],F.spd[1]), messy, rode:false });
      w.waveT=ri(F.gap[0],F.gap[1]);
    }
  }
  // waves that reach the shoreline CRASH: spawn a whitewater burst, then remove them
  for(const wv of w.waves){
    if(!wv.crashed && wv.y>=SHORE-6){
      wv.crashed=true;
      spawnCrash(wv.x, wv.len, wv.messy);
      if(wv.big){ (w.surges||(w.surges=[])).push({x:wv.x, len:wv.len*0.9, t:0, dur:150, reach:26}); }   // rogue: whitewater runs up da sand, then pulls back
      beep(wv.messy?150:220, .18, 'sawtooth', .03);   // shorebreak thud
    }
  }
  for(const wv of w.waves) wv.y+=wv.spd;   // same speed whether or not you're riding it
  w.waves=w.waves.filter(wv=>wv.y<SHORE-4);           // gone once it breaks on the sand
  // advance crash foam + run-up surges
  for(const g of (w.surges||[])) g.t++;
  w.surges=(w.surges||[]).filter(g=>g.t<g.dur);
  for(const c of w.crashes){ c.life--; c.r+=1.4; }
  w.crashes=w.crashes.filter(c=>c.life>0);
}
function spawnCrash(x,len,messy){
  // a line of foam puffs along the shoreline where the wave broke
  const half=len/2, n=Math.max(5,(len/14)|0);
  for(let i=0;i<n;i++){
    water.crashes.push({ x:x-half + (i/(n-1))*len, y:SHORE-4,
      r:rnd(1,3), life:ri(18,30), messy });
  }
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(){
  frame++; seaPhase++; music();
  if(player.injured>0 && state!=='water'){ player.injured--; if(player.injured===0){ player.recover=0; setMsg("Bite all healed up. Go surf, braddah! 🤙",120); beep(540,.14,'triangle'); } }   // heals on its own on land (~12 s)
  dayT = (dayT + 1/DAY_LEN) % 1;   // advance the day/night clock
  if(msgT>0)msgT--; if(flashT>0){ flashT--; flash.y-=0.4; }
  if(consume('mute')){ muted=!muted; setMsg(muted?"🔇 muted":"🔊 sound on",60); }
  if(consume('quest') && (state==='beach'||state==='water'||state==='cabin')) questOpen=!questOpen;
  if(questOpen){ if(consume('b')||consume('enter')) questOpen=false; return; }   // log open: game pauses
  if(beachBuilt||state==='beach'||state==='water') tickWaves();  // swell keeps rolling in every scene
  if(beachBuilt) tickBuggy();  // lifeguard ATV keeps driving even while you surf
  if(beachBuilt) tickLineup(); // Hui, pros and sharks keep going whether you're in da water or not
  if(beachBuilt) tickLocal();  // a local strolls the beach ~1/min and drops stuff
  if(beachBuilt) tickTourist();  // a lone original tourist wanders by
  if(beachBuilt) tickKelly();    // Kelly Slater cameo on the beach
  if(beachBuilt) tickStroller(); // other North Shore names strolling da sand (friendly, not surfing)
  if(beachBuilt) tickRoad();     // clothed walkers + cyclists stroll the dirt sidewalk
  if(state==='splash'){
    if(newGameT>0) newGameT--;
    if(consume('newgame')){ if(newGameT>0){ wipeSave(); location.reload(); return; } newGameT=240; beep(300,.1,'triangle'); }
    if(consume('enter')){ state='help'; beep(660,.1);} else if(consume('space')){ startGame(); } return; }
  if(state==='help'){ if(consume('enter')||consume('space')){ startGame(); } return; }
  if(state==='tank'){ updTank(); return; }
  if(state==='flight'){ updFlight(); return; }
  tickHeat();
  if(state==='gameover'){ if(consume('enter')||consume('space')){ score=0; state='splash'; } return; }
  if(state==='shop'){ updShop(); return; }
  if(state==='beach') updBeach(); else if(state==='water') updWater(); else if(state==='cabin') updCabin();
}

/* ---- SHOP: simple buy menu overlaid on the beach ---- */
let shop={ sel:0 };
function openShop(){ state='shop'; shop.sel=0; beep(680,.09,'triangle'); }
function shopList(){ return SHOP.filter(i=>!i.hidden || owned.includes(i.id)); }
function updShop(){
  const SL=shopList();
  if(consume('up'))   shop.sel=(shop.sel+SL.length-1)%SL.length;
  if(consume('down')) shop.sel=(shop.sel+1)%SL.length;
  if(consume('left')) shop.sel=(shop.sel+SL.length-1)%SL.length;
  if(consume('right'))shop.sel=(shop.sel+1)%SL.length;
  if(consume('b')||consume('space')){ state='beach'; return; }   // close
  if(consume('enter')){ buy(SL[shop.sel]); }
}
function buy(item){
  if(item.kind==='treat'){
    if(coins>=item.price){ coins-=item.price; setCoins(coins); gifts++; floatScore('ONO!',W/2,60,C.good); beep(900,.1);
      setMsg("Shave ice to go ("+gifts+"). Maybe somebody at RCVA wants one...",180); }
    else beep(160,.12,'sawtooth');
    return;
  }
  const have=owned.includes(item.id);
  if(!have){
    if(coins>=item.price){ coins-=item.price; setCoins(coins); owned.push(item.id); saveOwned(owned); beep(880,.1); }
    else { beep(160,.12,'sawtooth'); return; }  // can't afford
  }
  // own it → equip it
  equip[item.kind]=item.id; saveEquip(equip); applyEquip(); beep(760,.08,'triangle');
}

function updBeach(){
  const b=beach, sp=1.3;   // walking pace (a little slower)
  if(player.hitCool>0) player.hitCool--;
  if(player.knockT>0){            // knocked out by the ATV — no control (buggy still rolls via tickBuggy)
    player.knockT--;
    return;
  }
  const ox0=player.x, oy0=player.y;
  if(keys.left){ player.x-=sp; player.facing=-1; }
  if(keys.right){ player.x+=sp; player.facing=1; }
  if(keys.up) player.y-=sp;
  if(keys.down) player.y+=sp;
  { // solid obstacles: slide along them, never through (axis-by-axis; free if already overlapping)
    const rs=solidsNow(), nx=player.x, ny=player.y;
    if(feetHit(nx,ny,rs) && !feetHit(ox0,oy0,rs)){
      if(!feetHit(nx,oy0,rs)){ player.x=nx; player.y=oy0; }          // slide along x
      else if(!feetHit(ox0,ny,rs)){ player.x=ox0; player.y=ny; }     // slide along y
      else { player.x=ox0; player.y=oy0; }                           // stuck: stay put
    }
  }

  // ----- screen transitions (walk off an edge) -----
  if(IS_DOWN(b.screen)){
    // Vertical down-scene: beach edge up top. UP walks back to the beach screen above it.
    player.y=clamp(player.y,SEATOP+10,H-10);
    if(b.scrLock>0){ b.scrLock--; }
    else if(player.y<=SEATOP+12 && keys.up){ b.screen=UP_FROM[b.screen]; b.scrLock=10; player.x=clamp(player.x,20,W-20); player.y=H-30; beep(560,.07,'triangle'); return; }
    // LAND row scrolls left/right too: MY PLACE ◀ RCVA HOUSE ▶ DA COVE (mirrors the beaches above)
    const li=LAND_ROW.indexOf(b.screen);
    if(player.x<=10 && keys.left){
      if(li>0){ b.screen=LAND_ROW[li-1]; player.x=W-24; announceLand(); return; }
      player.x=10;
    }
    if(player.x>=W-10 && keys.right){
      if(li<LAND_ROW.length-1){ b.screen=LAND_ROW[li+1]; player.x=24; announceLand(); return; }
      player.x=W-10;
    }
    player.x=clamp(player.x,10,W-10);
  } else {
    // beach screens: ↑ at shoreline paddles out
    player.y=clamp(player.y,SHORE+4,H-14);
    if(b.scrLock>0){ b.scrLock--; }
    if(player.y<=SHORE+6 && keys.up && b.scrLock===0){
      const B=BREAK[b.screen];
      if(B && B.final && !pipeReady() && !(typeof heat!=='undefined' && heat.on)){
        b.scrLock=90; player.y=SHORE+14; beep(300,.12,'triangle');
        setMsg("🛟 Lifeguard: 'Pipeline is da FINAL test, brah. Still need: "+pipeMissing().join(', ')+".'",300); return; }
      if(B && rankIdx()<B.rank && !(typeof heat!=='undefined' && heat.on)){
        b.scrLock=90; player.y=SHORE+14; beep(300,.12,'triangle');
        setMsg("🛟 Lifeguard: 'Eh, "+B.name+" too heavy fo' you right now. Come back when you're "+RANKS[B.rank].n+".'",240); return; }
      enterWater(); return; }
    // left/right edges move between TOWN(0) ◀ SURF(1) ▶ COVE(2)
    // trigger when you walk INTO the edge (not a pixel-exact test)
    const bi=BEACH_ROW.indexOf(b.screen);
    if(player.x<=10 && keys.left){
      if(bi>0){ b.screen=BEACH_ROW[bi-1]; player.x=W-24; announceScreen(); return; }
      player.x=10;  // western-most screen: wall
    }
    if(player.x>=W-10 && keys.right){
      if(bi<BEACH_ROW.length-1){ b.screen=BEACH_ROW[bi+1]; player.x=24; announceScreen(); return; }
      player.x=W-10; // eastern-most screen: wall
    }
    player.x=clamp(player.x,10,W-10);
    // from the SURF beach, walk DOWN off the bottom → pop out AT the RCVA house (down top).
    // from any beach screen, walk DOWN off the bottom → pop out at its down-scene (top).
    if(DOWN_MAP[b.screen]!==undefined && player.y>=H-14 && keys.down && b.scrLock===0){
      b.screen=DOWN_MAP[b.screen]; b.scrLock=10; player.x=(b.screen===SCR.HOUSE||NEW_LAND.has(b.screen))?W/2:W/2-80; player.y=SEATOP+18;
      beep(560,.07,'triangle'); return;
    }
  }

  if(consume('inspect')) doInspect();   // I = look at whatever you're standing by
  // ----- per-screen interactions -----
  if(b.screen===SCR.SURF){
    if(player.injured && near(player.x,player.y,b.chandler.x,b.chandler.y+6,22)){
      player.recover++;
      if(player.recover>80){ player.injured=0; player.recover=0; beep(540,.14,'triangle');
        setMsg("Chandler: 'You good now, braddah. Surf wit' aloha.'",150); }
      else if(frame%30===0) setMsg("Chandler patching you up... hang loose",40);
    } else if(near(player.x,player.y,b.chandler.x,b.chandler.y+6,26) && consume('b')){
      beep(520,.08,'triangle'); b.chatCool=300;
      if(quest.lesson<LESSONS.length){ const L=LESSONS[quest.lesson];
        if(!quest.active){ quest.active=true; quest.sess=0; saveQuest(); setMsg(L.intro+"  ("+L.goal+")",320); }
        else setMsg("Chandler: 'Lesson "+(quest.lesson+1)+" — "+L.name+": "+L.goal+"'",260); }
      else if(!quest.gun) setMsg("Chandler: 'You ready, braddah. Go see Turtle at da barn — your board stay waiting.'",260);
      else setMsg("Chandler: "+CHANDLER_LINES[ri(0,CHANDLER_LINES.length-1)],150);
    } else if(near(player.x,player.y,b.chandler.x,b.chandler.y+6,22)){
      if(b.chatCool>0) b.chatCool--;
      else { setMsg("Chandler: "+CHANDLER_LINES[ri(0,CHANDLER_LINES.length-1)],150);
        beep(500,.08,'triangle'); b.chatCool=260; }
    }
  }
  if(b.screen===SCR.PIPE && near(player.x,player.y,JUDGE.x,JUDGE.y,26) && consume('b')){
    if(heat.on) setMsg("Head judge: 'Heat stay running — go surf! "+Math.ceil(heat.t/60)+" seconds left.'",160);
    else if(!pipeReady()) setMsg("Head judge: 'Pipe Masters is da final. You still need: "+pipeMissing().join(', ')+".'",300);
    else startHeat();
  }
  if(b.screen===SCR.TOWN){
    // SHOP: walk up to da shave-ice stand, press B
    if(near(player.x,player.y,b.iceShop.x,b.iceShop.y,24)){
      if(consume('b')){ openShop(); return; }
      
    }
    // say HI to the locals
    for(const f of b.folks){ if(f.cool>0) f.cool--;
      if(near(player.x,player.y,f.x,f.y,18) && f.cool===0){
        setMsg("Local: "+GREETS[ri(0,GREETS.length-1)],130); beep(600,.07,'triangle'); f.cool=240; } }
  }
  // any enterable house (My Place, RCVA, Da Cove, Auntie's): B opens the door, then walk in
  if(IS_DOWN(b.screen)){
    const rid=atDoorSpot();
    if(rid && ROOMS[rid].needRank && rankIdx()<ROOMS[rid].needRank && consume('b')){
      beep(260,.12,'triangle'); setMsg("Hui braddah: 'Members only. Earn some respect in da water first — come back when you're one "+RANKS[ROOMS[rid].needRank].n+".'",240); return; }
    if(rid && consume('b')){
      if(b.doorOpen===rid){ enterRoom(rid); return; }            // door already open: B walks you in
      b.doorOpen=rid; beep(520,.07,'triangle'); }
    if(rid && b.doorOpen===rid && (keys[ROOMS[rid].enter] || (ROOMS[rid].zone && (keys.up||keys.down)))){ enterRoom(rid); return; }
    if(!rid) b.doorOpen=false;   // door swings shut when you walk off
  }
  // MY HOUSE: walk up to the hammock and press B to sleep until morning
  if(b.screen===SCR.MYHOUSE){
    const HM=myHammock();         // same spot drawMyHouse draws the hammock
    if(near(player.x,player.y,HM.x,HM.y,40)){
      if(consume('b')){ sleepTilMorning(); return; }
      
    }
  }
  // RCVA yard: walk past da Billabong fence → Sterling Spencer pops up ovah it
  if(b.sterling>0) b.sterling--;
  if(b.sterlingCool>0) b.sterlingCool--;
  if(b.screen===SCR.HOUSE && b.sterling===0 && b.sterlingCool===0){
    const BB=billabongLayout();
    if(player.x>=BB.p1-6 && player.x<=BB.f0+30 && player.y>=BB.ft && player.y<=BB.fb+14){
      b.sterling=STERLING_T; b.sterlingCool=STERLING_T+450; beep(640,.08,'triangle');
      setMsg("Sterling: 'You know da rulez!!'",STERLING_T);
    }
  }
  // props can be picked up on whichever beach screen they're on (surf/cove)
  if(!IS_DOWN(b.screen)){
    for(const p of b.props){
      if(BEACH_ROW[p.s]!==b.screen) continue;   // dis thing lies on a different beach
      if(p.k==='honu'){   // da honu (sea turtle) stays put resting — you just notice it once in a while
        if(p.cool>0) p.cool--;
        else if(near(player.x,player.y,p.x,p.y,22)){ p.cool=900; setMsg("A honu (sea turtle) restin' on da sand. Give 'um space, yeah.",240); beep(560,.06,'triangle'); }
        continue; }
      if(!p.got && near(player.x,player.y,p.x,p.y,15)){
        p.got=true; beep(760,.06);
        propFound(p); }
    }
  }
  if(false){
  for(const p of b.props){ if(!p.got && near(player.x,player.y,p.x,p.y,15)){
    p.got=true; beep(760,.06);
    propFound(p);
  }}
  }
  // photographer: out only ~20% of the time. When his timer elapses, ROLL:
  // 90% he shows up (new spot, picked once), else he stays away for another window.
  // While he IS out we never touch his position — just count down his visit.
  if(b.photoT>0) b.photoT--;
  else if(!b.photographer){
    if(Math.random()<0.90){ b.photographer={x:rnd(140,340),y:H-60,t:ri(1200,1800)};
      // he only works da COVE — only announce it when you're standing on that beach
      if(state==='beach' && b.screen===SCR.COVE){ setMsg("📷 Photographer on da beach — surf in front of him and he'll sell your shot fo' coins!",180); beep(880,.1); } }
    else b.photoT=ri(60,120);    // keep him off the beach, try again soon
  }
  if(b.photographer){ b.photographer.t--; if(b.photographer.t<0){ b.photographer=null; b.photoT=ri(120,240); } }
}

// the lifeguard ATV drives the beach independent of the scene, so it keeps
// rolling even while you're out in the water.
// the ATV's x on the CURRENT beach screen, or null if it's on another screen / you're inland
function buggyLX(){
  const b=beach; if(!b.buggy || IS_DOWN(b.screen)) return null;
  const bi=BEACH_ROW.indexOf(b.screen); if(bi<0) return null;
  const x=b.buggy.wx - bi*W;
  return (x>-40 && x<W+40) ? x : null;
}
function tickBuggy(){
  const b=beach; if(!beachBuilt) return;
  // ONE ATV for the whole coast: it drives in WORLD x from off the west end of town,
  // across TOWN → SURF → COVE, and out past the east end of the cove. Each screen shows it only while it's there.
  if(b.buggyT>0)b.buggyT--; else if(!b.buggy){ b.buggy={wx:-30}; }
  if(b.buggy){ b.buggy.wx+=1.4; const bx=buggyLX();
    if(b.buggy.wx>BEACH_ROW.length*W+30){ b.buggy=null; b.buggyT=ri(600,1100); }
    // ATV hits you -> knocked out ~3s, but only while you're ON the beach screen it's driving through
    else if(state==='beach' && bx!==null && player.knockT===0 && near(player.x,player.y,bx,SHORE+16,16)){
      player.knockT=180; beep(90,.4,'sawtooth',.06);
      setMsg("💥 LIFEGUARD ATV wen' run you ovah!",180); } }
}

function photographerOut(){ return beach && beach.photographer && beach.screen===SCR.COVE; }   // only counts surfing da cove

// which beach (index in BEACH_ROW) you're on or under right now
function curIdx(){ const sc=beach.screen; let i=BEACH_ROW.indexOf(sc); if(i<0) i=LAND_ROW.indexOf(sc); return Math.max(0,i); }
// spawn a walker at da edge of YOUR current beach; after dat it lives on its own screen
function spawnRoamer(o){ const fromLeft=Math.random()<0.5; return Object.assign(o,{ s:curIdx(), x:fromLeft?-20:W+20, dir:fromLeft?1:-1, hops:ri(1,3) }); }
// move along; crossing a screen edge carries dem to da next beach. false = walked off da coast / done
function roamStep(R,sp){ R.x+=sp*R.dir;
  if(R.dir>0 && R.x>W+20){ if(R.s>=BEACH_ROW.length-1 || R.hops<=0) return false; R.s++; R.hops--; R.x=-20; R.said=0; }
  if(R.dir<0 && R.x<-20){ if(R.s<=0 || R.hops<=0) return false; R.s--; R.hops--; R.x=W+20; R.said=0; }
  return true; }
// is dis walker on da beach you're looking at?
function onMyBeach(R){ return !!R && !IS_DOWN(beach.screen) && BEACH_ROW[R.s]===beach.screen; }
function tickStroller(){
  const b=beach; if(!beachBuilt) return;
  if(!b.stroller){
    if(b.strollerT>0){ b.strollerT--; return; }
    let i=ri(0,STROLLERS.length-1); if(i===b.lastStroller) i=(i+1)%STROLLERS.length;
    b.lastStroller=i;
    const fromLeft=Math.random()<0.5;
    b.stroller=spawnRoamer({ i, y:SHORE+ri(30,H-SHORE-22), said:0, base:ri(0,2) });   // 2 different lines per walk
  } else {
    const S=b.stroller, who=STROLLERS[S.i];
    if(!roamStep(S,0.6)){ b.stroller=null; b.strollerT=ri(1800,3000); return; }
    const prog = S.dir>0 ? S.x/W : 1-S.x/W, stops=[0.3,0.7];
    while(S.said<stops.length && prog>=stops[S.said]){
      if(state==='beach' && onMyBeach(S)){
        setMsg(who.say+": '"+who.lines[(S.base+S.said)%who.lines.length]+"'",200); beep(600,.07,'triangle'); }
      S.said++; }
  }
}
function drawStroller(){

function tickLocal(){

    if(L.drops>0){ L.nextDrop--; if(L.nextDrop<=0){

function updWater(){
  const w=water;
  // spawn swell lines moving toward shore (y grows downward = toward beach)
  if(player.invuln>0) player.invuln--;
  if(player.trickT>0) player.trickT--;
  for(const s of w.spray){ s.x+=s.vx; s.y+=s.vy; s.vy+=0.22; s.life--; }
  w.spray=w.spray.filter(s=>s.life>0);
  if(player.downT>0){ player.downT--; if(player.downT===0 && player.y>SEABOT-4) { } return; }

  const paddling=!w.surfing;
  const wading = paddling && player.y>WADE_Y;     // knee-deep near da beach: you stand up and walk
  const sp=w.surfing?2.4:wading?1.1:0.95;         // paddling is slower than walking (1.3); wading in between
  if(keys.left){ player.x-=sp; if(paddling)player.facing=-1; }
  if(keys.right){ player.x+=sp; if(paddling)player.facing=1; }
  if(paddling){ const v=wading?1.1:0.9; if(keys.up)player.y-=v; if(keys.down)player.y+=v; }
  player.x=clamp(player.x,14,W-14);
  player.y=clamp(player.y,SEATOP+6,SEABOT);

  // go to beach from the inside
  if(!w.surfing && keys.down && player.y>=SEABOT-1){ enterBeach(player.injured?"Limp in fo' heal, braddah":"Pau surf. Back on da sand."); return; }

  // drop-in: must be close to a clean swell line
  if(!w.surfing && consume('space')){
    const feel=RIDE_FEEL[rankIdx()];
    const reach = feel[0] + ((player.longboard || player.wax>0) ? 6 : 0);   // rank sets how close you must be; gun/wax helps
    const wv=w.waves.find(v=>!v.rode && Math.abs(v.y-player.y)<reach && Math.abs(v.x-player.x)<v.len/2+10);
    if(wv){ if(wv.messy){ wipeout("Messy closeout wen' buss you up!"); }
      else { w.surfing=true; w.cur=wv; wv.rode=true; w.ride=0; w.combo=0; w.style=0; beep(600,.1,'sawtooth');
        if(player.wax>0) player.wax--;
        setMsg("DROP IN! Z / X tricks (+ UP or DOWN fo' more) · Q = tricks you know",120);
        if(quest.active && quest.lesson===1){ quest.sess++; saveQuest(); if(quest.sess>=3) lessonDone(); }
        if(quest.active && quest.lesson===2 && dayT>=0.05 && dayT<0.25) lessonDone(); } }
    else setMsg("No swell right dea — paddle onto a wave line, cuz",60);
  }

  if(w.surfing){
    // you're only surfing while you're ON your wave. The instant it's gone or you've
    // slid off its face, the ride ends and you're paddling again — no phantom standing.
    const onWave = w.cur && w.waves.includes(w.cur)
                && w.cur.y < SHORE-4
                && player.x > w.cur.x - w.cur.len/2 - RIDE_FEEL[rankIdx()][1]
                && player.x < w.cur.x + w.cur.len/2 + RIDE_FEEL[rankIdx()][1];   // groms slip off easier
    if(!onWave){ endRide(); }
    else {
      w.ride++; score+=1;
      player.y=w.cur.y;                         // ride the face in
      player.x += (w.cur.x - player.x)*RIDE_FEEL[rankIdx()][2];    // better surfers stay in da pocket
      if(frame%5===0) beep(280+Math.min(w.ride,220),.02,'sine',.012);
      // tricks — capture each key ONCE, then decide (fixes Z being eaten by &&)
      const zHit=consume('z'), xHit=consume('x');
      if(zHit||xHit){
        const want = zHit&&xHit ? 'barrel' : zHit ? (keys.up?'float':keys.down?'snap':'cut') : (keys.up?'air':keys.down?'round':'lip');
        let T=TRICKS.find(t=>t.id===want);
        if(T.rank>rankIdx()){ setMsg("🔒 "+T.name.replace(/!/g,'')+" unlocks at "+RANKS[T.rank].n+" rank",90); T=TRICKS.find(t=>t.id===(zHit?'cut':'lip')); }
        trick(T.name,T.pts,T.id==='barrel'?C.purp:T.id==='air'?C.bad:C.gold,T.id);
      }
      // kick out on purpose, or ride into the shorebreak
      if(player.y>=SHORE-8 || consume('space')){ endRide(); }
    }
  }

}

// da lineup at each beach keeps living while you're on da sand: Hui + pros keep surfing, sharks stay
function lineup(sc){ const w=water; w.lineups=w.lineups||{}; const k=(sc===undefined?beach.screen:sc);
  return w.lineups[k] || (w.lineups[k]={ huis:[], pro:null, shark:null, huiT:ri(260,480), proT:ri(360,700), sharkT:ri(620,1100) }); }
function tickLineup(){
  if(!beachBuilt || IS_DOWN(beach.screen) || (state!=='beach' && state!=='water')) return;
  const w=water, LU=lineup(), inSea=(state==='water');
  // HUI
  if(LU.huiT>0)LU.huiT--; else if(LU.huis.length<2){
    LU.huis.push({ x:rnd(W*0.45,W-30), y:ri(SEATOP+14,SEABOT-16), vx:rnd(-0.25,0.25), vy:rnd(0.08,0.22) });
    LU.huiT=ri(320,560); setMsg("⚠️ Da HUI stay in da water — keep your distance!",130); beep(160,.2,'sawtooth'); }
  for(const h of LU.huis){
    if(h.surf){ // riding a wave in
      if(h.wave && w.waves.includes(h.wave)){ h.y=h.wave.y; h.x+=h.vx*0.4;
        h.x=clamp(h.x, h.wave.x-h.wave.len/2+8, h.wave.x+h.wave.len/2-8); }  // stay on the face
      else { h.surf=false; h.wave=null; }
      if(h.y>=SEABOT-6){ h.surf=false; h.wave=null; h.y=SEATOP+12; h.x=rnd(40,W-40); }
    } else {
      h.x+=h.vx; h.y+=h.vy;
      if(h.x<16||h.x>W-16)h.vx*=-1; if(h.y>SEABOT-6){ h.y=SEATOP+12; h.x=rnd(40,W-40); }
      // actively hunt a clean wave: drift toward the nearest crest, then grab it
      let best=null, bd=1e9;
      for(const v of w.waves){ if(v.messy||v===w.cur) continue;
        if(h.x>v.x-v.len/2-20 && h.x<v.x+v.len/2+20){ const d=Math.abs(v.y-h.y); if(d<bd){ bd=d; best=v; } } }
      if(best){ h.y += Math.sign(best.y-h.y)*0.5;   // paddle to meet the wave
        if(bd<14 && Math.random()<0.8){ h.surf=true; h.wave=best; } }
    }
    if(inSea && player.downT===0 && player.invuln===0 && near(player.x,player.y,h.x,h.y,15)){
      wipeout("Da Hui wen' knock you off! Respect da lineup.");
      // bump apart so you don't get stuck in a knock-down loop
      player.y=clamp(player.y+24,SEATOP+6,SEABOT);
      player.x=clamp(player.x+(player.x<h.x?-26:26),14,W-14);
      h.y=clamp(h.y-18,SEATOP+12,SEABOT-6); h.surf=false; h.wave=null;
      player.invuln=90;  // ~1.5s grace to paddle clear
    } }

  // FAMOUS SURFER — one at a time (Laird is in the roster). Cocky, snakes your wave, no damage.
  if(LU.proT>0)LU.proT--; else if(!LU.pro){
    const p=PROS[ri(0,PROS.length-1)];
    const kl = p.name==='Kelly Slater' ? "'"+KELLY_LINES[(kellyIdx++)%KELLY_LINES.length]+"'" : p.line;
    LU.pro={ name:p.name, line:kl, female:!!p.female, kelly:p.name==='Kelly Slater', x:rnd(60,W-60), y:SEATOP+12, t:ri(360,560), surf:false, wave:null };
    setMsg(p.name+" paddling out — "+p.line,140); beep(520,.1,'triangle'); }
  if(LU.pro){ const L=LU.pro; L.t--;
    if(L.bit){ L.surf=false; L.wave=null; L.y+=0.45; }   // shark got 'em: paddlin' straight to shore
    else if(L.surf){
      if(L.wave && w.waves.includes(L.wave)){ L.y=L.wave.y; L.x+=Math.sin(frame*0.1)*0.8;
        L.x=clamp(L.x, L.wave.x-L.wave.len/2+8, L.wave.x+L.wave.len/2-8); }  // stay on the face
      else { L.surf=false; L.wave=null; }
      if(L.y>=SEABOT-6){ L.surf=false; L.wave=null; }
    } else {
      L.y+=0.22;
      // hunt the nearest clean wave and drop in readily — pros neva miss
      let best=null, bd=1e9;
      for(const v of w.waves){ if(v.messy||v===w.cur) continue;
        if(L.x>v.x-v.len/2-20 && L.x<v.x+v.len/2+20){ const d=Math.abs(v.y-L.y); if(d<bd){ bd=d; best=v; } } }
      if(best){ L.y += Math.sign(best.y-L.y)*0.6;
        if(bd<14 && Math.random()<0.85){ L.surf=true; L.wave=best; setMsg(L.name+" droppin' in — "+L.line,110); } }
    }
    if(!L.bit && inSea && near(player.x,player.y,L.x,L.y,15)&&w.surfing){
      setMsg(L.name+" SNAKED your wave! "+(L.kelly?"'My wave, kook. Always was.'":"'Did you see that one?!'"),110);
      player.x=clamp(player.x+(player.x<L.x?-22:22),20,W-20); }
    if((L.t<0&&!L.bit)||L.y>SEABOT){ LU.pro=null; LU.proT=ri(260,520); } }

  // SHARK: hunts you. It steers toward the player while they're in the water
  // and lunges when it gets close. Once it has bitten someone, or you're safe
  // on the sand, it gives up and swims off.
  if(LU.sharkT>0)LU.sharkT--; else if(!LU.shark){
    const fromLeft = player.x > W/2;
    LU.shark={x:fromLeft?-24:W+24, y:ri(SEATOP+24,SEABOT-16), vx:0, vy:0,
      dir:fromLeft?1:-1, speed:rnd(0.9,1.25), lunge:0, hunt:true, life:ri(1200,2100)};   // hangs 20-35 s, den leaves
    beep(80,.5,'sawtooth',.06); setMsg("🦈 SHARK!! Get to shore, braddah!",160); }
  if(LU.shark){ const s=LU.shark;
    if(s.hunt && --s.life<=0){ s.hunt=false; s.dir=s.x<W/2?-1:1; }   // gets bored and heads out, in da water or not
    const inWater = player.y < SHORE-4;
    if(s.hunt && inSea && inWater && !player.injured){
      const dx=player.x-s.x, dy=player.y-s.y, d=Math.hypot(dx,dy)||1;
      if(s.lunge>0) s.lunge--;
      else if(d<48 && Math.random()<0.04){ s.lunge=22; beep(110,.15,'sawtooth',.05); }
      const sp = s.speed*(s.lunge>0?1.9:1);
      s.vx += (dx/d*sp - s.vx)*0.06;
      s.vy += (dy/d*sp - s.vy)*0.06;
      if(Math.abs(s.vx)>0.15) s.dir = s.vx>0?1:-1;
    } else if(s.hunt && LU.pro && !LU.pro.bit){   // no you in da water: it stalks da pro (neva da Hui)
      const P=LU.pro, dx=P.x-s.x, dy=P.y-s.y, d=Math.hypot(dx,dy)||1;
      s.vx += (dx/d*s.speed*0.8 - s.vx)*0.05; s.vy += (dy/d*s.speed*0.8 - s.vy)*0.05;
      if(Math.abs(s.vx)>0.15) s.dir = s.vx>0?1:-1;
    } else if(s.hunt){            // you're on da sand: it hangs around, cruising da lineup
      s.lunge=0;
      if(s.x<40) s.dir=1; if(s.x>W-40) s.dir=-1;
      s.vx += (s.dir*0.7 - s.vx)*0.04; s.vy += (Math.sin(frame*0.02+s.x*0.01)*0.3 - s.vy)*0.05;
    } else {
      s.lunge=0;
      s.vx += (s.dir*1.4 - s.vx)*0.05; s.vy *= 0.9;
    }
    s.x+=s.vx; s.y=Math.max(SEATOP+12, Math.min(SEABOT-10, s.y+s.vy));
    if(inSea && near(player.x,player.y,s.x,s.y,16)&&!player.injured){
      player.injured=720; beep(60,.6,'sawtooth',.07);   // ~12 s on land to heal
      setMsg("Shark wen' buss you up! Paddle in (DOWN) — heals in ~12 s on da sand, or Chandler fixes you quick.",200);
      w.surfing=false; w.cur=null; player.downT=36; s.hunt=false; }
    if(s.hunt && LU.pro && !LU.pro.bit && near(LU.pro.x,LU.pro.y,s.x,s.y,16)){   // takes out da pro (Hui stay untouched — even da sharks respect da Hui)
      LU.pro.bit=true; s.hunt=false; s.dir=s.x<W/2?-1:1; beep(70,.4,'sawtooth',.05);
      setMsg("🦈 Shark wen' hit "+LU.pro.name+"! Dey okay — paddlin' back to shore.",170); }
    if(s.x>W+30||s.x<-30){ LU.shark=null; LU.sharkT=ri(240,480); } }
}
function trick(name,pts,col,id){ const w=water; w.combo++; w.style+=pts;
  score+=pts*w.combo; floatScore((w.combo>1?('x'+w.combo+' '):'')+name,player.x,player.y-16,col);
  beep(880+w.combo*50,.08,'square');
  // drive the trick animation: distinct pose + spray burst
  player.trickKind = id || (name.startsWith('BARREL')?'barrel' : name.startsWith('Off')?'lip' : 'cut');
  player.trickT = player.trickKind==='barrel'?34 : player.trickKind==='air'?32 : 22;
  spawnSpray(player.x, player.y, player.trickKind==='barrel'?'barrel':'cut'); }
function spawnSpray(x,y,kind){
  const n = kind==='barrel'?16:9;
  for(let i=0;i<n;i++) water.spray.push({ x, y:y-4,
    vx:rnd(-2.6,2.6), vy:rnd(-3.2,-0.6), life:ri(16,30), kind }); }
function endRide(){ const w=water; if(!w.surfing)return;
  const rideLen=w.ride, usedTricks=w.style>0, onBig=!!(w.cur&&w.cur.big), combo=w.combo;
  if(rideLen>=60) gainXP(1+Math.floor(rideLen/120)+(combo>=2?1:0));     // XP fo' every real ride
  if(heat.on && beach.screen===SCR.PIPE) heatRide(rideLen/60, w.style, combo);
  if(rideLen>=180 && LEVELS.includes(beach.screen) && !levelDone(beach.screen)){
    quest.passed=Object.assign({},quest.passed,{[beach.screen]:true}); saveQuest(); gainXP(15); beep(880,.15,'triangle');
    const left=LEVELS.filter(sc=>!levelDone(sc)).map(sc=>BREAK[sc].name), nm=BREAK[beach.screen].name;
    setTimeout(()=>setMsg("✅ You conquered "+nm+"! "+(left.length?"Still to go: "+left.join(', ')+".":"All breaks conquered — Pipeline is next."),300),1600); }
  if(quest.active && quest.lesson===0 && rideLen>=200 && !usedTricks) lessonDone();
  else if(quest.active && quest.lesson===3 && onBig && rideLen>=150) lessonDone();
  let bonus=Math.floor(w.ride*0.6)+w.style, note="Nice ride! "+(w.ride/60).toFixed(1)+" seconds";
  if(photographerOut()){ bonus*=2; note="📷 Da photog got your shot!"; beep(990,.14); }
  score+=bonus;
  // COINS come ONLY from da photographer: he sells your shot when he catches you riding at da cove
  let coinNote="";
  if(photographerOut()){ const earn=Math.min(6, 1+Math.floor(w.ride/80)+(w.combo>1?1:0)); coins+=earn; setCoins(coins); floatScore('🪙+'+earn,player.x,player.y-18,C.gold);
    coinNote="  📷 Photog sold your shot! 🪙+"+earn; }
  setMsg(note+(w.combo>1?(" · "+w.combo+"x combo!"):"")+coinNote,150);
  w.surfing=false; w.cur=null; w.ride=0; w.combo=0; w.style=0;
  // kick back out to the lineup, prone and paddling — no lingering stand
  player.y=clamp(player.y-28, SEATOP+20, SEABOT-20);
  player.trickT=0; player.trickKind='';
}
function wipeout(reason){ const w=water;
  // rashguard perk: shrug off ONE wipeout, then it's spent until you go ashore
  if(player.tough && !player.shieldUsed){ player.shieldUsed=true; w.combo=0;
    floatScore('RASHGUARD SAVE!',player.x,player.y-18,C.good); beep(520,.12,'triangle');
    setMsg("Rashguard saved you — keep ripping!",90); return; }
  w.surfing=false; w.cur=null; w.ride=0; w.combo=0; w.style=0;
  if(quest.active && quest.lesson===1 && quest.sess>0){ quest.sess=0; saveQuest(); }    // a wipeout resets "read da set"
  player.downT=48; setMsg(reason||"WIPEOUT! Worked in da impact zone.",120); beep(130,.28,'sawtooth');
  if(score>high){ high=score; setHS(high); } }

   ============================================================ */
function render(){
  if(state==='splash') return drawSplash();
  if(state==='tank'){ drawTank(); drawBanner(); return; }
  if(state==='flight'){ drawFlight(); return; }
  if(state==='help') return drawHelp();
  drawSky(); drawMountains();
  if(!(state==='beach' && IS_DOWN(beach.screen))){ drawSeaBands(); drawSand(); }
  if(state==='shop'){ drawBeach(); drawShop(); drawHUD(); return; }
  if(state==='beach') drawBeach(); else if(state==='water') drawWater(); else if(state==='cabin') drawCabin();
  // night wash over the whole world (beach + water), lifts near dawn
  if(isNight() && state!=='shop'){ ctx.save(); ctx.globalAlpha=0.34; ctx.fillStyle='#0a0f2a'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  if(sleepFade>0){ const a=sleepFade>35?(70-sleepFade)/35:sleepFade/35; ctx.save(); ctx.globalAlpha=Math.min(1,a*1.2); ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore(); sleepFade--; }
  drawHUD(); drawBanner(); drawKeyHint();
  if(questOpen) drawQuestLog();
}

function drawQuestLog(){
  ctx.save(); ctx.globalAlpha=.8; px(0,0,W,H,'#0a0618'); ctx.restore();
  const bx=40, by=28, bw=W-80, bh=H-56;
  px(bx,by,bw,bh,'#14233a'); ctx.strokeStyle=C.good; ctx.lineWidth=2; ctx.strokeRect(bx+1,by+1,bw-2,bh-2);
  ctx.textAlign='center'; ctx.fillStyle=C.gold; ctx.font='bold 12px "Courier New",monospace'; ctx.fillText('SURF JOURNAL',W/2,by+16);
  const r=rankIdx(), next=RANKS[r+1];
  ctx.textAlign='left'; ctx.font='bold 10px "Courier New",monospace'; ctx.fillStyle=C.txt;
  ctx.fillText('Rank: '+RANKS[r].n+'   '+xp+' XP'+(next?('  (next: '+next.n+' at '+next.min+')'):'  (top rank!)'),bx+12,by+34);
  if(next){ const t=(xp-RANKS[r].min)/(next.min-RANKS[r].min); px(bx+12,by+40,bw-24,5,'#2a3a5a'); px(bx+12,by+40,Math.round((bw-24)*Math.min(1,t)),5,C.good); }
  let y=by+60; const line=(txt,col)=>{ ctx.fillStyle=col||C.txt; ctx.fillText(txt,bx+12,y); y+=13; };
  ctx.font='bold 9px "Courier New",monospace'; line('QUESTS',C.gold); ctx.font='9px "Courier New",monospace';
  if(quest.lesson<LESSONS.length){ const L=LESSONS[quest.lesson];
    line((quest.active?'▶ ':'○ ')+"Chandler lesson "+(quest.lesson+1)+"/"+LESSONS.length+": "+L.name, quest.active?C.good:C.txt);
    line('    '+(quest.active?L.goal:"Talk to Chandler (B) on da Surf beach")+(quest.active&&quest.lesson===1?('  ['+quest.sess+'/3]'):''),'#b4b2cc');
  } else if(!quest.gun){ line("▶ Pick up your board from Turtle at da Shaping Barn (B)",C.good); }
  else line("✓ Chandler's lessons done — you ride Chandler's Gun",C.good);
  line((gifts>0?'▶ ':'○ ')+"Bring Andy Irons a shave ice (RCVA house)"+(gifts>0?'  — you have '+gifts:''), gifts>0?C.good:C.txt);
  line("○ Surf in front of da photog at da Cove fo' coins",C.txt);
  line("Breaks: "+LEVELS.map(sc=>(levelDone(sc)?'✓ ':'○ ')+BREAK[sc].name).join('   ')+"   (3+ s each)", C.txt);
  line(quest.champ?"✓ PIPE MASTERS CHAMPION — trophy at your place":(pipeReady()?"▶ FINAL: Pipe Masters — talk to da head judge at Pipeline (B)":"○ FINAL: Pipe Masters (needs all breaks, lessons, PIPE INVITE)"), quest.champ||pipeReady()?C.good:C.txt);
  y+=4; ctx.font='bold 9px "Courier New",monospace'; line('TRICKS (while riding)  — hold arrow, tap Z / X',C.gold);
  ctx.font='bold 10px "Courier New",monospace';
  TRICKS.forEach((T,i)=>{ const ok=T.rank<=r, cx=bx+12+(i%2)*(bw/2-6), cy=y+Math.floor(i/2)*14;   // 2 columns, bigger + bolder
    ctx.fillStyle=ok?C.gold:'#8a88a0'; ctx.fillText(T.keys,cx,cy);
    ctx.fillStyle=ok?C.txt:'#8a88a0'; ctx.fillText(T.name.replace(/!/g,'')+(ok?'':' 🔒'+RANKS[T.rank].n),cx+54,cy); });
  y+=Math.ceil(TRICKS.length/2)*14;
  ctx.textAlign='center'; ctx.fillStyle=C.good; ctx.fillText('Q / B to close',W/2,by+bh-8); ctx.textAlign='left';
}
/* ===================== PROLOGUE: da Arizona wave tank =====================
   You start as a desert kid surfing a machine-made wave pool. Win da little contest (3 clean rides),
   win a ticket to Hawaii, land on da North Shore as a total kook. Plays once; ENTER skips. */
const TANK={ x0:40, x1:440, y0:132, y1:262 };
let tank=null;
let newGameT=0;
function startGame(){
  let done=false; try{ done=!!localStorage.getItem('nsss_tank_done'); }catch(e){}
  if(done){ enterBeach(); return; }
  state='tank'; tank={ x:W/2, y:TANK.y1-14, facing:1, waves:[], t:40, riding:false, cur:null, ride:0, rides:0, need:3, end:0 };
  setMsg("ARIZONA. 112°F. Da only waves fo' 400 miles come out of one machine. Win da Desert Surf Classic: 3 clean rides!",360);
}
function finishTank(){ state='flight'; flight={ t:0 }; msgT=0; beep(440,.2,'triangle'); }
let flight=null;
const FLIGHT_LEN=480;   // ~8 s
function landInHawaii(){
  try{ localStorage.setItem('nsss_tank_done','1'); }catch(e){}
  enterBeach(); sleepFade=70;
  setMsg("✈️ Welcome to da North Shore, kook. Real waves no come from one machine. Go find Chandler.",360);
}
function updFlight(){ flight.t++; if(consume('enter') || flight.t>=FLIGHT_LEN) landInHawaii(); }
function drawFlight(){
  const t=flight.t, u=t/FLIGHT_LEN;
  // sky: desert dusk at takeoff -> bright island morning
  const mix=(a,b,k)=>'#'+[0,2,4].map(i=>Math.round(parseInt(a.substr(1+i,2),16)*(1-k)+parseInt(b.substr(1+i,2),16)*k).toString(16).padStart(2,'0')).join('');
  gradBand(0,0,W,180,mix('#f2a65a','#6fc6ee',Math.min(1,u*1.6)),mix('#ffd9a0','#c8ecff',Math.min(1,u*1.6)),10);
  // da Pacific below, swells rolling under you
  gradBand(0,180,W,H-180,'#1f6a9a','#0f4a7a',6);
  for(let i=0;i<40;i++){ const y=186+((i*29)%(H-190)), x=((i*97)-t*(0.6+((i*13)%5)*0.2))%(W+40); px((x+W+40)%(W+40)-20,y,14+(i%3)*6,1,'#4f9ac8'); }
  // clouds drifting past at two speeds
  for(let i=0;i<7;i++){ const cy=30+((i*41)%120), cx=((i*137)-t*(i%2?1.4:0.7))%(W+120); const X=(cx+W+120)%(W+120)-60;
    ctx.save(); ctx.globalAlpha=0.85; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.ellipse(X,cy,30+(i%3)*10,8,0,0,Math.PI*2); ctx.ellipse(X+18,cy-5,18,7,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  // Oahu rising on da horizon near da end: green ridges + a strip of sand
  if(u>0.55){ const k=Math.min(1,(u-0.55)/0.35), ix=W-60-k*140;
    ctx.fillStyle='#2f6a3a'; ctx.beginPath(); ctx.moveTo(ix-120,182); ctx.lineTo(ix-70,150-k*12); ctx.lineTo(ix-30,162); ctx.lineTo(ix+10,140-k*16); ctx.lineTo(ix+60,160); ctx.lineTo(ix+120,182); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#3f8a4a'; ctx.beginPath(); ctx.moveTo(ix-70,150-k*12); ctx.lineTo(ix-40,168); ctx.lineTo(ix-90,178); ctx.closePath(); ctx.fill();
    px(ix-120,180,240,3,'#e8d8a8'); }
  // da plane: a little jet banking across, contrail behind
  const plx=40+u*(W-120), ply=96+Math.sin(t*0.04)*6;
  for(let i=1;i<26;i++){ ctx.save(); ctx.globalAlpha=0.5*(1-i/26); px(plx-30-i*7,ply+2,7,2,'#ffffff'); ctx.restore(); }
  px(plx-28,ply,46,7,'#f2f2f2'); px(plx-28,ply,46,2,'#ffffff'); px(plx+18,ply+1,7,5,'#e8e8e8'); px(plx+22,ply+2,4,2,'#3a6a9a');   // fuselage + nose + cockpit
  for(let k=0;k<6;k++) px(plx-20+k*6,ply+3,3,2,'#3a6a9a');                                                                       // windows
  px(plx-34,ply-8,8,8,'#c0392b'); px(plx-6,ply+5,16,4,'#d8d8d8'); px(plx-10,ply-4,14,4,'#d8d8d8');                               // tail + wings
  // captions
  ctx.textAlign='center'; ctx.font='bold 13px "Courier New",monospace'; ctx.fillStyle='#14233a';
  ctx.fillText('ARIZONA  ✈  HAWAII',W/2+1,41); ctx.fillStyle='#fff6d0'; ctx.fillText('ARIZONA  ✈  HAWAII',W/2,40);
  const cap = u<0.33 ? "One-way ticket. One board. Zero clue." : u<0.66 ? "2,900 miles to da North Shore..." : "Oahu. Da real waves stay waiting.";
  ctx.font='bold 10px "Courier New",monospace'; ctx.fillStyle='#000000aa'; px(W/2-150,H-34,300,16,'#00000088');
  ctx.fillStyle='#fff2c0'; ctx.fillText(cap,W/2,H-22);
  ctx.fillStyle='#ffffffaa'; ctx.font='8px "Courier New",monospace'; ctx.fillText('ENTER to skip',W/2,H-6); ctx.textAlign='left';
  // fade in from da desert, fade out to da beach
  const fa = t<30 ? 1-t/30 : t>FLIGHT_LEN-40 ? (t-(FLIGHT_LEN-40))/40 : 0;
  if(fa>0){ ctx.save(); ctx.globalAlpha=fa; px(0,0,W,H,'#000'); ctx.restore(); }
}
function updTank(){
  const T=tank;
  if(consume('enter')){ finishTank(); return; }                                         // skip
  if(T.end>0){ T.end--; if(T.end===0) finishTank(); return; }
  if(T.t>0) T.t--; else { const len=ri(110,160); T.waves.push({ y:TANK.y0+4, x:ri(TANK.x0+len/2+6,TANK.x1-len/2-6), len, spd:0.38 }); T.t=150; }   // machine-made peaks, short sections
  for(const v of T.waves) v.y+=v.spd;
  T.waves=T.waves.filter(v=>v.y<TANK.y1-2);
  if(!T.riding){
    const sp=1.0;
    if(keys.left){ T.x-=sp; T.facing=-1; } if(keys.right){ T.x+=sp; T.facing=1; }
    if(keys.up) T.y-=1.0; if(keys.down) T.y+=1.0;
    T.x=clamp(T.x,TANK.x0+12,TANK.x1-12); T.y=clamp(T.y,TANK.y0+6,TANK.y1-10);
    if(consume('space')){ const v=T.waves.find(v=>Math.abs(v.y-T.y)<16 && Math.abs(v.x-T.x)<v.len/2+4);
      if(v){ T.riding=true; T.cur=v; T.ride=0; pressed.up=false; beep(600,.1,'sawtooth'); } else setMsg("Wait fo' da machine to push one wave, den SPACE.",80); }
  } else {
    if(!T.waves.includes(T.cur)){ endTankRide(); }
    else { T.ride++; T.y=T.cur.y;
      if(keys.left){ T.x-=2; T.facing=-1; } if(keys.right){ T.x+=2; T.facing=1; } T.x=clamp(T.x,TANK.x0+12,TANK.x1-12);
      if(consume('z')||consume('x')){ floatScore('CARVE!',T.x,T.y-16,C.gold); beep(880,.06,'square'); }
      if(Math.abs(T.x-T.cur.x)>T.cur.len/2+2){ floatScore('KICK OUT',T.x,T.y-16,C.txt); endTankRide(); }      // rode off da end
      else if(consume('up')){ T.y-=10; floatScore('KICK OUT',T.x,T.y-16,C.txt); endTankRide(); }            // pull out over da back
      else if(T.cur.y>=TANK.y1-8) endTankRide(); }
  }
}
function endTankRide(){
  const T=tank, secs=T.ride/60; T.riding=false; T.cur=null; T.y=clamp(T.y,TANK.y0+6,TANK.y1-10);   // stay where you finished
  if(secs>=1.5){ T.rides++; beep(760,.1,'triangle');
    if(T.rides>=T.need){ T.end=300; beep(990,.2,'triangle');
      setMsg("🏆 You won da DESERT SURF CLASSIC! Prize: one-way ticket to HAWAII. Pack your board, kid.",300); }
    else setMsg("Judges: clean ride! "+T.rides+"/"+T.need+" — da crowd stay going wild (all twelve of dem).",160); }
  else setMsg("Too short — stay on da machine wave longer (1.5+ seconds).",120);
}
function drawTank(){
  const T=tank;
  // desert sky + mesas + saguaros
  gradBand(0,0,W,120,'#f2a65a','#ffd9a0',10);
  ctx.fillStyle='#fff2c0'; ctx.beginPath(); ctx.arc(380,46,18,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#b4583a'; ctx.beginPath(); ctx.moveTo(0,110); ctx.lineTo(20,72); ctx.lineTo(120,72); ctx.lineTo(140,110); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#9a4a30'; ctx.beginPath(); ctx.moveTo(300,110); ctx.lineTo(320,84); ctx.lineTo(430,84); ctx.lineTo(452,110); ctx.closePath(); ctx.fill();
  gradBand(0,104,W,H-104,'#d8b070','#c89a5a',6);                                                   // sand + dirt
  for(const [cx,cy,h] of [[18,118,30],[462,124,34],[250,112,22]]){ px(cx-2,cy-h,5,h,'#3a7a3a'); px(cx-8,cy-h+10,4,10,'#3a7a3a'); px(cx-8,cy-h+10,6,3,'#3a7a3a'); px(cx+5,cy-h+6,4,12,'#3a7a3a'); px(cx+3,cy-h+14,5,3,'#3a7a3a'); }
  // da wave machine house + banner + bleachers
  px(TANK.x0+120,TANK.y0-26,160,24,'#9a9a9a'); px(TANK.x0+120,TANK.y0-26,160,3,'#c0c0c0');
  ctx.fillStyle='#333'; ctx.font='bold 7px monospace'; ctx.textAlign='center'; ctx.fillText('WAVE MACHINE',W/2,TANK.y0-12);
  px(70,30,340,14,'#c0392b'); ctx.fillStyle='#fff'; ctx.font='bold 9px "Courier New",monospace'; ctx.fillText('DESERT SURF CLASSIC',W/2,41); ctx.textAlign='left';
  px(70,30,2,74,'#888'); px(408,30,2,74,'#888');
  for(let r=0;r<3;r++){ px(TANK.x1+4,TANK.y0+10+r*12,34,4,'#8a8a8a'); for(let k=0;k<5;k++) px(TANK.x1+7+k*6,TANK.y0+4+r*12,4,6,['#e0533a','#2b6cb0','#ffd23f','#2fbfae','#f2f2f2'][(k+r)%5]); }
  // concrete pool + painted-blue water
  px(TANK.x0-8,TANK.y0-8,TANK.x1-TANK.x0+16,TANK.y1-TANK.y0+16,'#b8b4aa'); px(TANK.x0-8,TANK.y0-8,TANK.x1-TANK.x0+16,2,'#d8d4ca');
  gradBand(TANK.x0,TANK.y0,TANK.x1-TANK.x0,TANK.y1-TANK.y0,'#2f9ab8','#4fc0d8',6);
  for(let y=TANK.y0+6;y<TANK.y1;y+=10) for(let x=TANK.x0+4;x<TANK.x1;x+=40) px(x+((y*3)%20),y,10,1,'#7ad6e8');   // chlorine sparkle
  px(TANK.x0,TANK.y1-6,TANK.x1-TANK.x0,6,'#e8e4da');                                                        // concrete "beach" slope
  // machine waves: perfectly straight, perfectly identical
  for(const v of T.waves){ const x0=v.x-v.len/2;
    for(let i=0;i<v.len;i+=3){ px(x0+i,v.y+2,3,5,'#1f7a98'); px(x0+i,v.y,3,3,'#3fb0d0'); px(x0+i,v.y-2,3,2,'#e8f8ff'); } }
  // you
  if(T.riding){ drawBoard(T.x,T.y+4,player.board,T.facing); drawDude(T.x,T.y-5,C.skin,player.shorts,T.facing,'surf',frame,player.shirt,PLAYER_HAIR); }
  else { drawBoard(T.x,T.y+4,player.board,T.facing); drawDude(T.x,T.y+1,C.skin,player.shorts,T.facing,'paddle',frame,player.shirt,PLAYER_HAIR); }
  // HUD
  px(0,0,W,16,'#00000059'); ctx.font='bold 10px "Courier New",monospace'; ctx.fillStyle=C.gold; ctx.textAlign='left';
  ctx.fillText('🌵 ARIZONA — rides '+T.rides+'/'+T.need,6,12);
  ctx.textAlign='right'; ctx.fillStyle=C.txt; ctx.font='bold 8px "Courier New",monospace'; ctx.fillText('SPACE catch · L/R steer · UP kick out · ENTER skip',W-6,11); ctx.textAlign='left';
  if(T.end>0 && T.end<70){ ctx.save(); ctx.globalAlpha=1-T.end/70; px(0,0,W,H,'#000'); ctx.restore(); }
}

// nudge a beach prop's x so it isn't hidden under a palm on the SURF or COVE screens
function clearOfPalms(x){
  for(let pass=0; pass<3; pass++){
    let moved=false;
    for(const scr of [SCR.SURF,SCR.COVE]) for(const [pxl] of BEACH_PALMS[scr]){
      const c=pxl+3; if(Math.abs(x-c)<30){ x = (x<c && c-34>40) || c+34>W-40 ? c-34 : c+34; moved=true; } }
    if(!moved) break;

}

function solidsNow(){
  const b=beach, out=[];

  if(IS_DOWN(b.screen)){
    const houseBand=SEATOP+10, roadY=SEATOP+140;

    if(b.screen===SCR.HOUSE)      out.push([RCVA_X-52, houseBand+18, RCVA_X+52, houseBand+70],   // RCVA (left)
                                           [W/2-40, TRAIL_HOUSE_BASE-36, W/2+40, TRAIL_HOUSE_BASE+2]); // house across the trail
    else if(b.screen===SCR.MYHOUSE) out.push([W*0.60-52, houseBand+20, W*0.60+52, houseBand+92]);   // house + porch
    else /* COVEDOWN */            out.push([W*0.38-35, houseBand+36, W*0.38+35, houseBand+70]);
    // the stone walls along the sidewalk (drawn on every land screen; gate gap in the middle stays open)
    { const wy=roadY-12;
      if(b.screen===SCR.HOUSE){ const BB=billabongLayout();
        out.push([16,wy,W/2-22,wy+12], [W/2+16,wy,W-16,wy+12]);   // one gate: the center path
        out.push([BB.x-42, houseBand+30, BB.x+42, houseBand+70]);                          // Billabong house
        out.push([BB.f0-1, BB.ft-9, BB.f1+4, BB.ft-1],   // picket fence: back row
                 [BB.f0-1, BB.fb-11, BB.f1+4, BB.fb],  //   front row
                 [BB.f0-1, BB.ft-9, BB.f0+4, BB.fb],   //   left side (along the path)
                 [BB.f1-1, BB.ft-9, BB.f1+4, BB.fb]);  //   right side
      } else out.push([16,wy,W/2-22,wy+12], [W/2+16,wy,W-16,wy+12]); }
  }
  // ATV on the beach screens blocks you (it's solid); everything else is walk-through
  { const bx=buggyLX(); if(bx!==null) out.push([bx-16, SHORE+8, bx+16, SHORE+24]); }
  return out;
}
function feetHit(x,y,rs){
  const fx0=x-4,fx1=x+4,fy0=y+10,fy1=y+14;
  for(const r of rs) if(fx1>r[0]&&fx0<r[2]&&fy1>r[1]&&fy0<r[3]) return true;

function pxLine(x0,y0,x1,y1,col,t){

function pxRing(cx,cy,r,col){

}

// front fence (drawn right after this) hides his lower body; a clip hides anything below its top.
function drawSterling(BB){
  const t=beach.sterling, rise=Math.min(1,(STERLING_T-t)/18, t/18);  // stand up, hold, sit back down
  const fenceTop=BB.fb-11, sx=BB.f0+18;
  const sy=fenceTop-1+Math.round((1-rise)*16);                  // up: head+shoulders over the fence
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,fenceTop); ctx.clip();
  drawDude(sx,sy,'#c88a4e','#c0392b',1,'stand',0);              // frozen pose, no walk cycle
  px(sx-4,sy-4,9,8,'#2b6cb0'); px(sx-4,sy-4,9,2,'#3f86d0');     // blue tee
  px(sx-4,sy-13,8,2,'#e8d27a');                                 // blond hair
  ctx.restore();
  if(rise>0.6){
    nameTag('STERLING',sx,fenceTop-22,C.gold);
  }
}

function atDoorSpot(){
  if(state!=='beach' || !IS_DOWN(beach.screen)) return null;
  for(const id in ROOMS){ const r=ROOMS[id]; if(r.screen!==beach.screen) continue;
    if(r.zone){ const [a,b2,c2,d]=r.zone; if(player.x>=a && player.x<=c2 && player.y>=b2 && player.y<=d) return id; continue; }
    const okY = r.enter==='up' ? (player.y>=r.sy-30 && player.y<=r.sy+30) : (player.y>=r.sy-30 && player.y<=r.sy+18);
    if(Math.abs(player.x-r.sx)<32 && okY) return id; }
  return null;
}

  if(room==='rcva'){ const r=RCVA_ROOM; return [...braz,f(r.couch),f(r.coffee),f(r.tv),f(r.fridge),f(r.stairs)]; }
  if(room==='cove'){ const r=COVE_ROOM; return [...braz,f(r.bed),f(r.bench),f(r.horses),f(r.rack),f(r.resin),[r.turtle.x-6,r.turtle.y+6,r.turtle.x+6,r.turtle.y+14]]; }
  if(room==='hui'){ const r=HUI_ROOM; return [...braz,f(r.couch),f(r.bar),f(r.pool),...r.crew.map(([x,y])=>[x-6,y+6,x+6,y+14])]; }
  if(room==='trail'){ const r=AUNTIE_ROOM; return [...braz,f(r.counter),f(r.table),f(r.chair),[r.auntie.x-6,r.auntie.y+6,r.auntie.x+6,r.auntie.y+14]]; }

function updCabin(){
  const sp=1.3, ox=player.x, oy=player.y;
  if(consume('inspect')) doInspect();
  if(player.waxing>0){                      // helping Turtle wax da board — hands busy, no walking
    if(consume('b')){ player.waxing=0; beep(380,.07,'triangle');            // B again = put da wax down and stop
      setMsg("You put da wax down. Turtle: 'No worries, brah. Come back anytime.'",180); return; }
    player.waxing--;
    if(player.waxing===120) setMsg("Turtle: 'Small circles, brah. Like da tide coming in.'",120);
    if(player.waxing===60)  setMsg("Turtle: 'Get da rails too! Chee, you got da touch.'",120);
    if(frame%14===0) beep(900+((frame>>3)%3)*60,.02,'triangle',.02);   // squeaky wax
    if(player.waxing===0){ player.wax=3; beep(760,.1,'triangle'); floatScore('WAXED!',player.x,player.y-20,C.good);
      setMsg("You and Turtle waxed 'um up. Sticky! Next 3 waves catch easier.",240); }
    return;
  }
  if(keys.left){ player.x-=sp; player.facing=-1; }
  if(keys.right){ player.x+=sp; player.facing=1; }
  if(keys.up) player.y-=sp;
  if(keys.down) player.y+=sp;
  player.x=clamp(player.x,CABIN.x0+12,CABIN.x1-12);
  player.y=clamp(player.y,CABIN.floorY-8,CABIN.y1-14);
  const rs=cabinSolids(), nx=player.x, ny=player.y;
  if(feetHit(nx,ny,rs) && !feetHit(ox,oy,rs)){
    if(!feetHit(nx,oy,rs)){ player.y=oy; } else if(!feetHit(ox,ny,rs)){ player.x=ox; } else { player.x=ox; player.y=oy; }
  }
  // out the door: walk down into it, or press B standing on it
  const atDoor=atCabinDoor();
  if(atDoor && (keys.down || consume('b'))){ leaveCabin(); return; }
  // B next to the bed = sleep till morning (your own place only)
  if(room==='myplace' && nearCabinBed() && consume('b')){ sleepTilMorning(); }
  if(npcCool>0) npcCool--;
  if(nearAndy()){
    if(consume('b')){
      if(gifts>0){ gifts--; floatScore('SHAKA',player.x,player.y-18,C.gold); npcCool=300; beep(880,.1);
        setMsg("Andy Irons: 'Shave ice?! Now we talking. You can stay, brah.'",240); }
      else { npcCool=300; beep(300,.08,'triangle'); setMsg("Andy Irons: 'Empty hands? Go get me one shave ice from town, brah.'",240); }
    } else if(npcCool===0){ npcCool=600; beep(520,.07,'triangle'); setMsg("Andy Irons: 'What gifts have you brought me?'",240); }
  }
  if(nearBlank() && consume('b')){ player.waxing=180; player.facing = player.x<COVE_ROOM.blank.x ? 1 : -1; beep(640,.08,'triangle');
    setMsg("Turtle: 'Eh, grab one bar of wax, help me out!'",120); }
  if(nearTurtle() && quest.lesson>=LESSONS.length && !quest.gun && consume('b')){
    quest.gun=true; saveQuest(); if(!owned.includes('board_chandler')){ owned.push('board_chandler'); saveOwned(owned); }
    equip.board='board_chandler'; saveEquip(equip); applyEquip(); gainXP(30); beep(990,.2,'triangle');
    setMsg("Turtle: 'Chandler shaped dis gun fo' YOU, brah.' 🏄 You got CHANDLER'S GUN — catches waves way easier!",320); }
  if(nearTurtle() && npcCool===0){ npcCool=600; beep(540,.07,'triangle');
    setMsg(pickLine('turtle-talk',["Turtle: 'Eh braddah! Chandler says shape da board wit' your soul, not your hands.'","Turtle: 'Grab one wax at da blank. B. Make 'um stick.'","Turtle: 'Dis gun going be da one fo' Pipe. Watch.'","Turtle: 'Chandler no sell boards. He give 'um to who earns 'um.'"]),240); }
  if(nearAuntie() && npcCool===0){ npcCool=600; beep(560,.07,'triangle');
    setMsg(pickLine('auntie-talk',["Auntie: 'Eat, eat! You stay too skinny, boy.'","Auntie: 'Banana bread fresh out da oven. Take two.'","Auntie: 'You went surf again? Wash your feet first!'"]),240); }
}

function drawRoomShell(P){
  const c=CABIN, lit=isNight();
  px(0,0,W,H,'#0e0a08');
  const T=16, ox0=c.x0-T, ox1=c.x1+T, oy0=c.wallY-12, oy1=c.y1+T;
  // brick masonry on every wall (classic top-down adventure-game room)
  px(ox0,oy0,ox1-ox0,oy1-oy0,P.frame);
  for(let y=oy0, r=0; y<oy1; y+=8, r++){
    for(let x=ox0-(r%2?8:0); x<ox1; x+=16){
      const bx=Math.max(x,ox0), bw=Math.min(x+16,ox1)-bx; if(bw<=0) continue;
      px(bx,y,bw,1,P.frameHi); px(bx,y+7,bw,1,P.frameSh); px(bx+bw-1,y,1,8,P.frameSh);
    }
  }
  // the floor sits in a recessed well: dark inner lip + lit outer edge
  px(c.x0-2,c.floorY-2,c.x1-c.x0+4,c.y1-c.floorY+4,P.frameSh);
  px(ox0,oy0,ox1-ox0,2,shade(P.frameHi,20)); px(ox0,oy0,2,oy1-oy0,shade(P.frameHi,20));
  px(ox1-2,oy0,2,oy1-oy0,'#0e0a08'); px(ox0,oy1-2,ox1-ox0,2,'#0e0a08');
  // back-wall strip just above the floor (where furniture leans): a timber rail
  px(c.x0,c.floorY-8,c.x1-c.x0,6,P.wain); px(c.x0,c.floorY-8,c.x1-c.x0,1,P.wainHi); px(c.x0,c.floorY-3,c.x1-c.x0,1,P.wainLn);
  // flat floor with soft tile seams (low contrast)
  px(c.x0,c.floorY,c.x1-c.x0,c.y1-c.floorY,P.tileA);
  for(let y=c.floorY+16; y<c.y1; y+=16) px(c.x0,y,c.x1-c.x0,1,P.tileLn);
  for(let y=c.floorY, r=0; y<c.y1; y+=16, r++) for(let x=c.x0+(r%2?8:0); x<c.x1; x+=16) px(x,y,1,Math.min(16,c.y1-y),P.tileLn);

  // twin braziers either side of da doorway, flames flicker
  for(const bx of [c.doorX-46, c.doorX+46]){
    const by=c.y1-14, f=(frame>>2)%3;
    px(bx-6,by,12,8,'#5a5650'); px(bx-6,by,12,2,'#8a857c'); px(bx-4,by+8,8,2,'#3a3630');

    ctx.save(); ctx.globalAlpha=lit?.22:.10; ctx.fillStyle='#ffb050'; ctx.beginPath(); ctx.arc(bx,by-4,26,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

// surfboard hung on the wall, seen from the FRONT (deck view): pointed nose, round tail, stringer
function drawWallBoard(x0,y0,x1,y1,deck){
  const cx=(x0+x1)/2, hw=(x1-x0)/2, h=y1-y0;
  const shape=(inset)=>{ const w=hw-inset, t=y0+inset, b=y1-inset;
    ctx.beginPath(); ctx.moveTo(cx,t);
    ctx.bezierCurveTo(cx+w*0.9,t+h*0.18, cx+w,t+h*0.42, cx+w,b-h*0.3);
    ctx.bezierCurveTo(cx+w,b-h*0.08, cx+w*0.45,b, cx,b);
    ctx.bezierCurveTo(cx-w*0.45,b, cx-w,b-h*0.08, cx-w,b-h*0.3);
    ctx.bezierCurveTo(cx-w,t+h*0.42, cx-w*0.9,t+h*0.18, cx,t); ctx.closePath(); };
  ctx.save(); ctx.globalAlpha=.25; ctx.fillStyle='#000'; ctx.translate(2,2); shape(0); ctx.fill(); ctx.restore(); // wall shadow
  const dk=deck||'#2fbfae';
  ctx.fillStyle=shade(dk,-40); shape(0); ctx.fill();                  // rail (outline)
  ctx.fillStyle=dk; shape(1.5); ctx.fill();                            // deck
  ctx.save(); shape(1.5); ctx.clip();
  ctx.fillStyle=shade(dk,50); ctx.fillRect(cx-hw,y0,hw*0.55,h);         // lit left rail
  ctx.fillStyle='#ffd23f'; ctx.fillRect(cx-hw,y0+h*0.30,hw*2,3);        // racing stripe
  ctx.fillStyle='#e0563a'; ctx.fillRect(cx-hw,y0+h*0.30+3,hw*2,1);
  ctx.fillStyle='#2a3a3a'; ctx.fillRect(cx-hw,y1-h*0.22,hw*2,h*0.22);   // tail traction pad
  for(let yy=y1-h*0.22+2; yy<y1; yy+=3) { ctx.fillStyle='#3a4a4a'; ctx.fillRect(cx-hw,yy,hw*2,1); }
  ctx.restore();
  px(cx,y0+3,1,h-6,'#f2ead8');                                         // wooden stringer down the middle
  px(cx-1,y1-5,3,2,'#111');                                            // leash plug
  px(x0-3,y0+h*0.35,4,3,'#5a3c22'); px(x1-1,y0+h*0.35,4,3,'#5a3c22'); // wall pegs holding it
}

function nearestInspectable(){
  let best=null, bd=1e9;
  for(const it of inspectables()){ const dx=player.x-it.x, dy=player.y-it.y, d=dx*dx+dy*dy; if(d<it.r*it.r && d<bd){ bd=d; best=it; } }
  return best;
}
function doInspect(){
  const it=nearestInspectable();
  if(it){ setMsg(pickLine(it.id,it.lines),170); beep(700,.05,'triangle'); }
  else setMsg("Nothing much fo' look at here.",70);
}
// small tag above your head: what B does here, plus I if there's something to look at
// small key LEGEND, always in the bottom-right corner (just above the message bar).
// Each row lights up gold when that key does something right here; otherwise it stays dim.
function drawKeyHint(){
  if(state!=='beach' && state!=='cabin') return;
  let act=null;
  if(state==='cabin'){ if(atCabinDoor()) act=['↓','walk out']; else if(nearCabinBed()) act=['B','sleep']; else if(nearAndy()) act=['B','give gift']; else if(nearTurtle() && quest.lesson>=LESSONS.length && !quest.gun) act=['B','get your board']; else if(player.waxing>0) act=['B','stop waxing']; else if(nearBlank()) act=['B','help Turtle wax']; }
  else {
    const b=beach;
    const rid=atDoorSpot();
    if(rid) act = b.doorOpen===rid ? ['B',(ROOMS[rid].enter==='up'?'/ ↑':'/ ↓')+' walk in'] : ['B','open door'];
    else if(b.screen===SCR.MYHOUSE){ const HM=myHammock(); if(near(player.x,player.y,HM.x,HM.y,40)) act=['B','sleep']; }
    else if(b.screen===SCR.TOWN && near(player.x,player.y,b.iceShop.x,b.iceShop.y,24)) act=['B','shop'];
    else if(b.screen===SCR.SURF && near(player.x,player.y,b.chandler.x,b.chandler.y+6,26)) act=['B','talk to Chandler'];
    else if(b.screen===SCR.PIPE && near(player.x,player.y,JUDGE.x,JUDGE.y,26)) act=['B',heat.on?'heat info':'enter Pipe Masters'];
  }
  const look=!!nearestInspectable();
  const rows=[ act ? [act[0],act[1],true] : ['B','open / use',false], ['I','inspect',look] ];
  ctx.font='bold 7px monospace';
  const bw=Math.ceil(Math.max(...rows.map(r=>ctx.measureText(r[1]).width)))+22, bh=rows.length*10+4;
  const bx=W-bw-4, by=H-Math.max(26,bannerH+4)-bh;   // stays above a wrapped message
  ctx.save(); ctx.globalAlpha=.78; px(bx,by,bw,bh,'#0a0618'); ctx.restore();
  rows.forEach(([k,label,on],i)=>{
    const y=by+10+i*10, col=on?C.gold:'#b4b2cc';
    px(bx+3,y-7,9,9,on?'#3a2a08':'#1a1830'); px(bx+3,y-7,9,1,col);     // little keycap
    ctx.fillStyle=col; ctx.textAlign='center'; ctx.fillText(k,bx+7.5,y); ctx.textAlign='left';
    ctx.fillText(label,bx+16,y);
  });
}

  const g=lit?'#ffd98a':'#bfe0e0';

  px(x-30,topY+14,16,2,trim); px(x+14,topY+14,16,2,trim);
  // --- hammock in the yard, left of the house (where you sleep) ---

  drawDude(x-16,y-2,C.skin,'#2a3a6a',1,'stand',frame);   // blue board shorts
  // give da camera guy a photographer's vest over his torso
  const tx=x-16;
  px(tx-5,y-6,10,8,'#3a7a4a'); px(tx-5,y-6,3,8,'#4a9a5c'); px(tx+2,y-6,3,8,'#2a5a38'); // vest 3-tone
  px(tx-3,y-4,2,2,'#1a3a24'); px(tx+1,y-1,2,2,'#1a3a24');  // vest pockets
  nameTag('📷 2x WAVES',x-11,y-25,C.gold);
}

  // tire tread nubs
  for(let a=0;a<6;a++){ px(x-18+Math.cos(a+frame*0.1)*5-1,y+7+Math.sin(a+frame*0.1)*5-1,2,2,'#000'); }
  // chassis / body
  px(x-16,y-3,34,8,'#d12f2f');       // main body red

  px(x-18,y+3,6,3,'#b02020'); px(x+12,y+3,6,3,'#b02020'); // fenders
  // rescue board rack on back
  px(x-24,y-6,10,3,'#ffd23f'); px(x-24,y-6,10,1,'#fff');
  // front rack + headlight
  px(x+16,y-5,5,4,'#333'); px(x+19,y-4,3,3,'#ffe08a');
  // handlebars + seat
  px(x+6,y-9,2,6,'#222'); px(x+2,y-10,10,2,'#222');   // bars
  px(x-10,y-7,12,4,'#111');                            // seat
  // rider (lifeguard) — small torso + red cap
  px(x-6,y-16,8,9,'#c88a4e'); px(x-6,y-18,8,3,'#e33'); // body + cap
  px(x-7,y-12,3,4,'#c88a4e'); px(x+4,y-13,4,3,'#c88a4e'); // arm reaching bars
  // RESCUE cross decal
