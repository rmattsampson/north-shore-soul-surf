<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- North Shore — Soul Surf app icon (original pixel-style mark) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a4a"/>
      <stop offset="0.45" stop-color="#b34a7a"/>
      <stop offset="0.75" stop-color="#e8683f"/>
      <stop offset="1" stop-color="#ffc94d"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13405f"/>
      <stop offset="1" stop-color="#2f93aa"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="330" cy="150" r="64" fill="#ffe08a"/>
  <circle cx="330" cy="150" r="40" fill="#fff3c4"/>
  <!-- mountains -->
  <polygon points="40,250 140,140 240,250" fill="#2d5a3f"/>
  <polygon points="190,250 300,170 400,250" fill="#3f2a56"/>
  <!-- sea -->
  <rect x="0" y="250" width="512" height="150" fill="url(#sea)"/>
  <!-- foam lines -->
  <rect x="40" y="280" width="90" height="10" fill="#eafcff"/>
  <rect x="200" y="300" width="90" height="10" fill="#eafcff"/>
  <rect x="360" y="285" width="90" height="10" fill="#eafcff"/>
  <!-- sand -->
  <rect x="0" y="400" width="512" height="112" fill="#e9cf8f"/>
  <rect x="0" y="400" width="512" height="10" fill="#eafcff"/>
  <!-- a little surfer on a board -->
  <rect x="236" y="336" width="60" height="10" fill="#ffd23f"/>
  <rect x="258" y="312" width="18" height="18" fill="#c88a4e"/>
  <rect x="258" y="300" width="18" height="10" fill="#2a1a12"/>
  <rect x="244" y="318" width="14" height="6" fill="#c88a4e"/>
  <rect x="276" y="314" width="14" height="6" fill="#c88a4e"/>
</svg>
